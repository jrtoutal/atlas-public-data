<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS 型錄 v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1012;--sb:#141618;--panel:#1a1d21;--card:#1f2328;--border:#2a2f36;--border2:#353b44;--gold:#d4a843;--gold2:#f0cc7a;--teal:#3aaa8c;--teal2:#4dc9a8;--red:#e06c6c;--indigo:#7b8cff;--amber:#e8b04a;--text:#dde2ee;--sub:#8a94a6;--muted:#4a5566}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.mono{font-family:'Space Mono',monospace}button,select,input{font-family:inherit;font-size:inherit}a{color:var(--indigo)}
.top{position:sticky;top:0;z-index:20;background:var(--sb);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .brand{font-weight:700;letter-spacing:.18em;font-size:12px;color:var(--gold);white-space:nowrap}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px}.crumb select{padding:5px 8px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text)}.crumb .sep{color:var(--muted)}
.crumb .lv{font-size:10px;color:var(--sub);letter-spacing:.1em;display:block;line-height:1}
/* 搜尋列 */
.search{background:var(--sb);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search input,.search select{padding:6px 9px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:13px}
.search input[type=search]{min-width:220px;flex:1}.search .n{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{font-size:11px;padding:1px 8px;border-radius:12px;border:1px solid var(--border2);color:var(--sub);cursor:pointer;background:var(--bg)}.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:600}
.stats{display:flex;gap:18px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.stats .s{display:flex;flex-direction:column}.stats .s b{font-size:20px;font-weight:700;line-height:1.2}.stats .s span{font-size:11px;color:var(--sub)}
.s.imp b{color:var(--teal2)}.s.fut b{color:var(--amber)}.s.no b{color:var(--sub)}.s.ltd b{color:var(--red)}
.wrap{display:grid;grid-template-columns:1fr 420px;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}.side{position:static}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;border-top:3px solid var(--muted);transition:.15s}
.tile:hover{border-color:var(--gold)}.tile.on{outline:2px solid var(--gold)}
.tile.imp{border-top-color:var(--teal)}.tile.fut{border-top-color:var(--amber)}.tile.ltd{border-top-color:var(--red)}
.tile .sw{aspect-ratio:1;background:#2a2e35 center/cover no-repeat;display:flex;align-items:flex-end;justify-content:flex-end;padding:4px;color:var(--muted);font-size:10px}
.tile .sw.none{align-items:center;justify-content:center}
.tile .b{padding:7px 9px}.tile .en{font-size:12px;font-weight:600;letter-spacing:.02em;line-height:1.3}.tile .ch{font-size:12.5px;color:var(--teal2);min-height:18px}.tile .ch.none{color:var(--muted);font-size:11px}
.sizes{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}.sz{font-family:'Space Mono',monospace;font-size:9.5px;padding:0 4px;border-radius:4px;border:1px solid var(--border2);color:var(--muted);line-height:1.5}
.sz.have{color:var(--teal2);border-color:var(--teal);background:rgba(58,170,140,.12)}.sz.unk{border-style:dashed}
.tile .st{font-size:10px;margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:10px;padding:0 6px;border-radius:5px;border:1px solid var(--border2);color:var(--sub);white-space:nowrap}
.tag.imp{color:var(--teal2);border-color:var(--teal)}.tag.fut{color:var(--amber);border-color:var(--amber)}.tag.ltd{color:#ff8a8a;border-color:var(--red)}
.side{position:sticky;top:112px;align-self:start;max-height:calc(100vh - 124px);overflow:auto}
.box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.box h3{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center}.box h3 .c{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0}
.hd{font-size:18px;font-weight:700;line-height:1.3}.hd small{display:block;font-size:12px;color:var(--teal2);font-weight:400}
.path{font-size:11px;color:var(--sub);margin-bottom:6px}.path b{color:var(--text);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--sub);padding:2px 0}.kv b{font-weight:400;color:var(--text);text-align:right}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hero.one{grid-template-columns:1fr}.hero.one .im{aspect-ratio:2/1}.hero .im{aspect-ratio:1;background:#2a2e35 center/cover;border-radius:8px;border:1px solid var(--border)}.hero .im span{font-size:10px;color:#fff;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:4px;margin:4px;display:inline-block}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs .t{width:62px;height:62px;border-radius:6px;background:#2a2e35 center/cover;border:1px solid var(--border);position:relative}.thumbs .t i{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:9px;background:rgba(0,0,0,.55);color:#ddd;text-align:center}
table.mx{width:100%;border-collapse:collapse;font-size:12px}.mx th{font-weight:500;color:var(--sub);font-size:11px;padding:4px 6px;border-bottom:1px solid var(--border2);text-align:center}.mx th:first-child{text-align:left}.mx td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:center;font-family:'Space Mono',monospace;font-size:11px}.mx td:first-child{text-align:left;font-family:'Noto Sans TC',sans-serif;font-size:12px}
.mx td.have{color:var(--teal2);background:rgba(58,170,140,.1)}.mx td.have::before{content:'✓ '}.mx td.no{color:var(--muted)}.mx td.none{color:var(--border2)}
.fin{display:inline-block;font-size:10px;padding:0 6px;border-radius:5px;border:1px solid var(--border2);color:var(--sub);margin:1px}.fin.have{color:var(--teal2);border-color:var(--teal)}
.field{margin:6px 0}.field label{display:block;font-size:11px;color:var(--teal2);margin-bottom:3px}.field select,.field input,.field textarea{width:100%;padding:6px 9px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text)}
.file{border:1px dashed var(--border2);border-radius:8px;padding:10px;font-size:12px;color:var(--sub);text-align:center}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sub);flex-wrap:wrap;margin-bottom:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:11px;color:var(--amber);margin-top:6px}.hint{font-size:12px;color:var(--sub)}
.v{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}.v i{width:9px;height:9px;border-radius:2px;background:var(--border2)}.v i.on{background:var(--amber)}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 26px}
.login-box h1{font-size:18px;margin:4px 0}.login-box p{color:var(--sub);font-size:12.5px;margin-bottom:20px}
.login-box .field{margin-bottom:12px}.login-box label{display:block;font-size:11px;color:var(--teal2);letter-spacing:.1em;margin-bottom:4px}.login-box input{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text)}
.login-box .err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--border2);background:var(--card);color:var(--text);cursor:pointer;font-size:13px}.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:700}.btn.w{width:100%;justify-content:center;margin-top:6px}.btn.sm{padding:4px 9px;font-size:12px}
#app{display:none}.st{font-size:12px;color:var(--sub)}.st.err{color:var(--red)}.st.ok{color:var(--teal2)}
.tile .sw{background-color:#2a2e35}.tile .sw img{width:100%;height:100%;object-fit:cover;display:block}
.vt{width:100%;border-collapse:collapse;font-size:12px}.vt th{text-align:left;font-weight:500;color:var(--sub);font-size:11px;padding:4px 6px;border-bottom:1px solid var(--border2)}.vt td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle}.vt td.m{color:var(--teal2);font-weight:500}.vt td .mono{font-size:11px}
.vt img{width:38px;height:38px;object-fit:cover;border-radius:5px;border:1px solid var(--border)}
.docs .d{display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}.docs .d a{color:var(--indigo)}.docs .d .x{margin-left:auto;color:var(--muted);cursor:pointer}
.sub2{display:none;margin-top:6px;padding:8px;border:1px dashed var(--border2);border-radius:8px}.sub2.on{display:block}
.empty{padding:40px;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<div id="login"><div class="login-box"><div style="color:var(--gold);font-weight:700;letter-spacing:.18em">▲ ATLAS</div><h1>型錄</h1><p>帷幄 · 僅限本人登入</p>
  <form id="loginForm"><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="pw" type="password" autocomplete="current-password" required></div><button class="btn pri w" id="loginBtn" type="submit">登入</button><div class="err" id="loginErr"></div></form></div></div>
<div id="app">
<div class="top">
  <a href="index.html" class="brand" style="text-decoration:none">ATLAS · 型錄</a>
  <div class="crumb">
    <label><span class="lv">廠商</span><select id="selVendor"></select></label><span class="sep">▸</span>
    <label><span class="lv">品牌／原廠</span><select id="selBrand"></select></label><span class="sep">▸</span>
    <label><span class="lv">系列</span><select id="selSeries"></select></label>
  </div>
  <span class="hint" style="margin-left:auto" id="meta"></span><button class="btn sm" id="logoutBtn">登出</button>
</div>
<div class="search">
  <input type="search" id="q" placeholder="搜尋：中文名、原廠名、型號、系列（跨全部品牌）">
  <select id="fSt"><option value="">狀態：全部</option><option>入庫</option><option>期貨</option><option>限量</option><option>停產</option></select>
  <select id="fFin"><option value="">表面：全部</option></select>
  <select id="fTh"><option value="">厚度：全部</option></select>
  <div class="chips" id="fSz"><span class="chip on" data-s="">尺寸：全部</span></div>
  <span class="n" id="cnt"></span>
</div>
<div class="wrap">
  <div><div class="legend"><span><i style="background:var(--teal)"></i>入庫</span><span><i style="background:var(--amber)"></i>期貨</span><span><i style="background:var(--red)"></i>限量／停產</span><span style="margin-left:auto">點一格看規格與狀態</span></div><div class="grid" id="grid"></div></div>
  <div class="side" id="side"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://riiflvhbxrnmzriwngjs.supabase.co', SB_KEY='sb_publishable_R69Hj9hcR5G4dp3Uz1J0PQ_1BabpwsN';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ROWS=[], DOCS=[], V='', B='', S='', SEL=null, FS='';
const ST_CLS={入庫:'imp',期貨:'fut',限量:'ltd',停產:'ltd'};
const REASONS=['原廠已下架','原廠停產通知','庫存出清中','改版換名','其他'];
const V_ZH={V1:'V1 均一（片片幾乎相同）',V2:'V2 輕微（色調小差異）',V3:'V3 中度（每片紋理明顯不同）',V4:'V4 強烈（鋪前要排版）'};

$('#loginForm').addEventListener('submit',async e=>{ e.preventDefault(); $('#loginBtn').disabled=true; const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pw').value}); $('#loginBtn').disabled=false; if(error){ $('#loginErr').textContent='登入失敗：'+(error.message.includes('Invalid')?'帳號或密碼錯誤':error.message); return; } boot(); });
$('#logoutBtn').addEventListener('click',async()=>{ await sb.auth.signOut(); location.reload(); });
async function boot(){ const {data:{session}}=await sb.auth.getSession(); if(!session){ $('#login').style.display='flex'; $('#app').style.display='none'; return; } $('#login').style.display='none'; $('#app').style.display='block'; await load(); }
async function load(){
  const all=[]; for(let i=0;;i+=1000){ const {data,error}=await sb.from('products').select('*').order('brand').order('series').order('factory_code').order('model').range(i,i+999); if(error){ $('#grid').innerHTML=`<div class="empty">讀取失敗：${esc(error.message)}（請先跑 supabase_41v2／44）</div>`; return; } all.push(...data); if(data.length<1000) break; }
  ROWS=all; const d=await sb.from('product_docs').select('*').order('created_at',{ascending:false}); DOCS=d.data||[];
  const vendors=[...new Set(ROWS.map(r=>r.vendor||r.source))]; V=vendors[0]||''; fillSel('#selVendor',vendors,V); onVendor(); 
  $('#meta').textContent=`${ROWS.length} 款 · 最近抓取 ${(ROWS.map(r=>r.last_seen).sort().pop()||'')}`; }
function fillSel(id,list,cur){ $(id).innerHTML=list.map(x=>`<option${x===cur?' selected':''}>${esc(x)}</option>`).join(''); }
function onVendor(){ const brands=[...new Set(ROWS.filter(r=>(r.vendor||r.source)===V).map(r=>r.brand))].sort(); B=brands.includes(B)?B:brands[0]; fillSel('#selBrand',brands,B); onBrand(); }
function onBrand(){ const ser=[...new Set(ROWS.filter(r=>(r.vendor||r.source)===V&&r.brand===B).map(r=>r.series))]; S=ser.includes(S)?S:ser[0]; fillSel('#selSeries',ser,S); onSeries(); }
function onSeries(){ const rs=cur(); const fins=[...new Set(rs.map(r=>r.finish).filter(Boolean))], ths=[...new Set(rs.map(r=>r.thickness).filter(Boolean))].sort((a,b)=>a-b), szs=[...new Set(rs.map(r=>r.size).filter(Boolean))];
  $('#fFin').innerHTML='<option value="">表面：全部</option>'+fins.map(f=>`<option>${esc(f)}</option>`).join(''); $('#fTh').innerHTML='<option value="">厚度：全部</option>'+ths.map(t=>`<option>${esc(t)}</option>`).join('');
  FS=''; $('#fSz').innerHTML='<span class="chip on" data-s="">尺寸：全部</span>'+szs.map(z=>`<span class="chip" data-s="${esc(z)}">${esc(z)}</span>`).join(''); SEL=null; render(); }
$('#selVendor').addEventListener('change',e=>{ V=e.target.value; onVendor(); }); $('#selBrand').addEventListener('change',e=>{ B=e.target.value; onBrand(); }); $('#selSeries').addEventListener('change',e=>{ S=e.target.value; onSeries(); });
const cur=()=>ROWS.filter(r=>(r.vendor||r.source)===V&&r.brand===B&&r.series===S);
// 品名 = 同 brand|series|factory_code 的變體群
function groups(){ const q=$('#q').value.trim().toLowerCase(); const base=q?ROWS.filter(r=>[r.import_name,r.factory_code,r.model,r.series,r.brand].join(' ').toLowerCase().includes(q)):cur();
  const g={}; for(const r of base){ const k=[r.brand,r.series,r.factory_code||r.model].join('|'); (g[k]??={brand:r.brand,series:r.series,en:r.factory_code||r.model,ch:r.import_name||'',rows:[]}).rows.push(r); }
  const st=$('#fSt').value, fin=$('#fFin').value, th=$('#fTh').value;
  return Object.values(g).filter(x=>{ const rs=x.rows; if(st&&!rs.some(r=>r.status===st)) return false; if(fin&&!rs.some(r=>r.finish===fin)) return false; if(th&&!rs.some(r=>r.thickness===th)) return false; if(FS&&!rs.some(r=>r.size===FS)) return false; return true; }); }
const gstatus=g=>{ const ss=g.rows.map(r=>r.status); return ss.includes('停產')&&ss.every(s=>s==='停產')?'停產':ss.includes('限量')?'限量':ss.includes('入庫')?'入庫':'期貨'; };
function render(){ const gs=groups(); $('#cnt').textContent=`${gs.length} 款`; const q=$('#q').value.trim();
  $('#grid').innerHTML=gs.map(g=>{ const st=gstatus(g); const img=g.rows.find(r=>r.image_url)?.image_url; const sizes=[...new Set(g.rows.map(r=>r.size).filter(Boolean))]; const k=[g.brand,g.series,g.en].join('|');
    return `<div class="tile ${ST_CLS[st]}${SEL===k?' on':''}" data-k="${esc(k)}"><div class="sw${img?'':' none'}">${img?`<img src="${img}" loading="lazy">`:'無圖'}</div><div class="b"><div class="en">${esc(g.en.toUpperCase())}</div><div class="ch${g.ch?'':' none'}">${esc(g.ch||'（期貨，未取中文名）')}</div>
      <div class="sizes">${sizes.map(z=>`<span class="sz have">${esc(z)}</span>`).join('')||'<span class="sz unk">尺寸未抓到</span>'}</div><div class="st"><span class="tag ${ST_CLS[st]}">${st}</span>${q?`<span class="tag">${esc(g.brand)} · ${esc(g.series)}</span>`:''}</div></div></div>`; }).join('')||'<div class="empty">沒有符合的款</div>';
  document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>{ SEL=t.dataset.k; render(); })); renderSide(); }
function renderSide(){ const g=groups().find(x=>[x.brand,x.series,x.en].join('|')===SEL); const s=$('#side'); if(!g){ s.innerHTML=`<div class="box"><h3>怎麼看</h3><div class="hint">一格＝一個品名（原廠名＋我們的中文名），底下的列＝我們進的型號（S／L 等變體：尺寸、厚度、表面）。狀態在右欄改，爬蟲不會蓋掉你改的「限量／停產」。原廠完整規格（我們沒進的尺寸）等原廠轉接器做好後補進來。</div></div>`; return; }
  const r0=g.rows[0]; const st=gstatus(g); const docs=DOCS.filter(d=>d.brand===g.brand&&(d.factory_code===g.en||(!d.factory_code&&d.series===g.series)));
  const ex=r0.extra||{};
  s.innerHTML=`<div class="box"><div class="path"><b>${esc(V)}</b> ▸ <b>${esc(g.brand)}</b> ▸ <b>${esc(g.series)}</b>${ex.series_tag?` · ${esc(ex.series_tag)}`:''}</div><div class="hd">${esc(g.en.toUpperCase())}<small>${esc(g.ch||'尚未取中文名')}${r0.origin?' · '+esc(r0.origin):''}</small></div>
    <div class="kv" style="margin-top:6px"><span>狀態</span><b><span class="tag ${ST_CLS[st]}">${st}</span>${r0.status_reason?' '+esc(r0.status_reason):''}</b></div>
    <div class="kv"><span>網址</span><b>${r0.source_url?`<a href="${r0.source_url}" target="_blank">BNF ↗</a>`:''}</b></div>
    <div class="kv"><span>抓取</span><b>首見 ${esc(r0.first_seen||'')} · 最近 ${esc(r0.last_seen||'')}</b></div></div>
  <div class="box"><h3>我們進的型號<span class="c">${g.rows.length} 個</span></h3><table class="vt"><tr><th></th><th>型號</th><th>尺寸</th><th>厚</th><th>表面</th><th>狀態</th></tr>${g.rows.map(r=>`<tr><td>${r.image_url?`<img src="${r.image_url}">`:''}</td><td class="m">${esc(r.model)}</td><td class="mono">${esc(r.size||'—')}</td><td class="mono">${esc(r.thickness||'')}</td><td>${esc(r.finish||'')}</td><td><span class="tag ${ST_CLS[r.status]||''}">${esc(r.status||'')}</span></td></tr>`).join('')}</table>
    ${ex.shade||ex.slip||ex.friction||ex.variability?`<div style="margin-top:8px">${ex.shade?`<div class="kv"><span>色差變化度</span><b>${esc(V_ZH[ex.shade]||ex.shade)}</b></div>`:''}${ex.variability?`<div class="kv"><span>模面變化</span><b>${esc(ex.variability)} 種</b></div>`:''}${ex.slip?`<div class="kv"><span>止滑</span><b>${esc(ex.slip)}${ex.friction?' · 摩擦 '+esc(ex.friction):''}</b></div>`:''}${ex.cert?`<div class="kv"><span>認證</span><b>${esc(ex.cert)}</b></div>`:''}</div>`:''}
    ${(ex.pdfs||[]).length?`<div class="hint" style="margin-top:6px">系列文件：${ex.pdfs.map((u,i)=>`<a href="${u}" target="_blank">PDF ${i+1}</a>`).join(' · ')}</div>`:''}</div>
  <div class="box"><h3>狀態與原廠通知<span class="c">整個品名一起改</span></h3>
    <div class="field"><label>狀態</label><select id="stSel">${['入庫','期貨','限量','停產'].map(x=>`<option${st===x?' selected':''}>${x}</option>`).join('')}</select></div>
    <div class="sub2${st==='限量'||st==='停產'?' on':''}" id="sub2">
      <div class="field"><label>原因</label><select id="stReason">${REASONS.map(x=>`<option${r0.status_reason===x?' selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>日期</label><input id="stOn" type="date" value="${esc(r0.status_on||'')}"></div>
      <div class="field"><label>備註（庫存量、何時出完…）</label><input id="stNote" value="${esc(r0.status_note||'')}"></div></div>
    <div class="actions" style="margin-top:8px"><button class="btn pri sm" id="stSave">儲存狀態</button> <span class="st" id="stMsg"></span></div>
    <div class="docs" style="margin-top:12px"><label style="font-size:11px;color:var(--teal2)">原廠通知／文件（PDF）</label>
      ${docs.map(d=>`<div class="d"><span class="tag">${esc(d.kind)}</span><a href="#" data-doc="${esc(d.path)}">${esc(d.title||d.path.split('/').pop())}</a><span class="sub">${esc(d.noted_on||'')}${d.factory_code?'':' · 整系列'}</span><span class="x" data-deldoc="${d.id}" title="移除">✕</span></div>`).join('')||'<div class="hint">還沒有文件</div>'}
      <div style="display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap"><select id="docKind" style="width:auto"><option>停產通知</option><option>價格通知</option><option>技術文件</option><option>其他</option></select><label class="hint" style="margin:0"><input type="checkbox" id="docSeries"> 整個系列</label><input type="file" id="docFile" accept="application/pdf,image/*" style="font-size:12px"></div></div></div>`;
  $('#stSel').addEventListener('change',e=>$('#sub2').classList.toggle('on',e.target.value==='限量'||e.target.value==='停產'));
  $('#stSave').addEventListener('click',async()=>{ const st=$('#stSel').value; const sub=st==='限量'||st==='停產'; const upd={status:st,status_reason:sub?$('#stReason').value:null,status_on:sub?($('#stOn').value||null):null,status_note:sub?($('#stNote').value||null):null};
    const {error}=await sb.from('products').update(upd).in('key',g.rows.map(r=>r.key)); if(error){ $('#stMsg').className='st err'; $('#stMsg').textContent=error.message; return; } g.rows.forEach(r=>Object.assign(r,upd)); $('#stMsg').className='st ok'; $('#stMsg').textContent='已存'; render(); });
  $('#docFile').addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f) return; const wholeSeries=$('#docSeries').checked; const path=`${g.brand}/${g.series}/${wholeSeries?'_series':g.en}/${Date.now()}_${f.name}`.replace(/[^\w\u4e00-\u9fff./ -]/g,'_');
    const up=await sb.storage.from('catalog-docs').upload(path,f,{upsert:true}); if(up.error){ alert('上傳失敗：'+up.error.message+'（請先跑 supabase_44）'); return; }
    const {data,error}=await sb.from('product_docs').insert({vendor:V,brand:g.brand,series:g.series,factory_code:wholeSeries?null:g.en,kind:$('#docKind').value,title:f.name,path,noted_on:new Date().toISOString().slice(0,10)}).select().single(); if(error){ alert(error.message); return; } DOCS.unshift(data); renderSide(); });
  document.querySelectorAll('[data-doc]').forEach(a=>a.addEventListener('click',async e=>{ e.preventDefault(); const {data,error}=await sb.storage.from('catalog-docs').createSignedUrl(a.dataset.doc,600); if(error){ alert(error.message); return; } window.open(data.signedUrl,'_blank'); }));
  document.querySelectorAll('[data-deldoc]').forEach(x=>x.addEventListener('click',async()=>{ if(!confirm('移除這份文件？')) return; const id=+x.dataset.deldoc; const d=DOCS.find(k=>k.id===id); await sb.storage.from('catalog-docs').remove([d.path]); await sb.from('product_docs').delete().eq('id',id); DOCS=DOCS.filter(k=>k.id!==id); renderSide(); })); }
['q','fSt','fFin','fTh'].forEach(id=>$('#'+id).addEventListener('input',render));
$('#fSz').addEventListener('click',e=>{ const c=e.target.closest('.chip'); if(!c) return; FS=c.dataset.s; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===c)); render(); });
sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') location.reload(); });
boot();
</script>
</body></html>
