  <div class="box${specFull?' full':''}"><h3>規格${(()=>{ const f=fpOf(g)[0]; return f?.source_url?`<span class="c"><a href="${esc(f.source_url)}" target="_blank">原廠頁 ↗</a></span>`:''; })()}</h3><div class="kvs">${ex.shade?`<div class="kv"><span>色差變化度</span><b>${esc(V_ZH[ex.shade]||ex.shade)}</b></div>`:''}${ex.variability?`<div class="kv"><span>模面變化</span><b>${esc(ex.variability)} 種</b></div>`:''}${(()=>{ const gr=[...new Set(g.rows.flatMap(greenOf))]; const who=k=>g.rows.filter(r=>greenOf(r).includes(k)).map(r=>nm(r.model)); return gr.map(k=>`<div class="kv"><span>綠建材</span><b style="color:var(--teal2)">${esc(GREEN_ZH[k]||k)}${who(k).length<g.rows.length?'（'+esc(who(k).join('、'))+'）':''}${ex.green_note?' · '+esc(ex.green_note):''}</b></div>`).join(''); })()}${ex.csr?`<div class="kv"><span>防滑 CSR（穿鞋）</span><b>${esc(ex.csr)} 以上</b></div>`:''}${ex.csrb?`<div class="kv"><span>防滑 CSR-B（赤腳）</span><b>${esc(ex.csrb)} 以上</b></div>`:''}${g.dom&&!ex.csr&&!ex.csrb?'<div class="kv"><span>防滑</span><b style="color:var(--muted)">官網沒寫（未做防滑試驗）</b></div>':''}${ex.slip&&!ex.csr?`<div class="kv"><span>止滑${dinParse(ex.slip)?'（DIN EN 16165）':''}</span><b>${esc(ex.slip)}${ex.friction?' · 摩擦 '+esc(ex.friction):''}</b></div>`:''}${ex.cert?`<div class="kv"><span>認證</span><b>${esc(ex.cert)}</b></div>`:''}${Object.entries(ex.pack||{}).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}${(ex.features||[]).map(x=>{ const [k,...v]=String(x).split(/[:：]/); return `<div class="kv"><span>${esc(k.trim())}</span><b>${esc(v.join(':').trim())}</b></div>`; }).join('')}${!(ex.shade||ex.variability||ex.slip||ex.cert||ex.pack||ex.csr||ex.csrb||(ex.green||[]).length||(ex.features||[]).length)?'<div class="hint">網站沒有標示</div>':''}</div>
    <div class="pdfs" style="margin-top:8px"><label style="font-size:11px;color:var(--teal2)">系列目錄（網站）</label>${pdfs.map(u=>`<div class="d"><a href="${u}" target="_blank">${esc(decodeURIComponent(u.split('/').pop()).replace(/\*/g,' '))}</a><span class="x" data-hidepdf="${esc(u)}" title="從這裡移除">✕</span></div>`).join('')||'<div class="hint">無</div>'}</div>
    ${(()=>{ const seen=new Set(); const dd=fpOf(g).flatMap(x=>Array.isArray(x.docs)?x.docs:[]).filter(d=>d&&d.u&&!seen.has(d.u)&&seen.add(d.u)); return dd.length?`<div class="pdfs" style="margin-top:8px"><label style="font-size:11px;color:var(--teal2)">原廠目錄（官網下載）</label>${dd.map(d=>`<div class="d"><a href="${esc(d.u)}" target="_blank">${esc(d.t||'文件')}<small style="color:var(--muted)"> ${esc(decodeURIComponent(d.u.split('/').pop()))}</small></a></div>`).join('')}</div>`:''; })()}</div>
  ${caiH}
  <div class="box${one1?'" style="grid-column:1':' full'}"><h3>原磚圖檔<span class="c">${g.rows.filter(r=>r.image_url).length} 張</span></h3><div class="hero" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${g.rows.filter(r=>r.image_url).map(r=>`<a class="im" href="#" data-lb="${esc((r.extra||{}).img_src||r.image_url)}" data-cap="${esc(nm(r.model))} ${esc(r.size||'')}" style="background-image:url('${r.image_url}')"><span>${esc(nm(r.model))} ${esc(r.size||'')}${(r.extra||{}).img_src?'':' · 600px'}</span></a>`).join('')||'<div class="hint">無</div>'}
    ${((g.rows[0].extra||{}).photo_src||[]).length?`<div class="thumbs">${g.rows[0].extra.photo_src.map((u,i)=>`<div class="t" style="background-image:url('${u}')" data-lb="${esc(u)}" data-cap="示意圖 ${i+1}"><i>示意 ${i+1}</i></div>`).join('')}</div>`:''}</div></div>
  <div class="box"><h3>原圖在哪<span class="c">NAS 原檔</span></h3><div class="hint">縮圖只有 600px；原圖與示意圖在公司 PC／NAS：</div><div class="path2">${esc(nasDir)}<span class="copy" data-copy="${esc(nasDir)}">複製路徑</span></div>
    <div class="hint" style="margin-top:6px">${(ex.photos||[]).length?`示意圖 ${ex.photos.length} 張：${ex.photos.map(p=>esc(p.split(/[\\/]/).pop())).join('、')}`:'沒有示意圖'}</div></div>
  ${!fpOnly?`<div class="box full"><h3>狀態與原廠通知<span class="c">勾選要改的型號（預設全部）</span></h3>
    ${(()=>{ const us=[...new Map(g.rows.flatMap(usedBy).map(u=>[u.name,u])).values()]; return us.length?`<div class="hint" style="border:1px solid var(--gold);border-radius:8px;padding:6px 10px;margin-bottom:8px">選色表使用：${us.map(u=>`<b style="color:${u.closed?'var(--muted)':'var(--gold2)'}">${esc(u.name)}</b>${u.closed?'（已結案）':'（進行中）'}`).join('、')}${us.some(u=>!u.closed)?' · 專案還沒結案，停產／限量也會留在預設畫面':''}</div>`:''; })()}
    ${(()=>{ const fp=fpOf(g); const hit=g.rows.filter(r=>!r.hidden&&rst(r)==='入庫'&&(goneRow(r)||(bnf&&goneFp(r,fp)))); if(!hit.length) return ''; const last=hit.map(r=>r.gone_on?r.last_seen:'').filter(Boolean).sort().pop()||fp.map(x=>x.last_seen||'').sort().pop()||''; return `<div class="hint" style="color:var(--amber);border:1px solid var(--amber);border-radius:8px;padding:6px 10px;margin-bottom:8px">原廠官網已下架${last?'（最後出現 '+esc(last)+'）':''}，我們還是入庫：${hit.map(r=>esc(nm(r.model))).join('、')}<br>還有庫存 → 改「限量」（出完不補）；沒有 → 改「停產」。 <button class="btn sm stQuick" data-st="限量" data-keys="${hit.map(r=>r.key).join(',')}">改限量</button> <button class="btn sm stQuick" data-st="停產" data-keys="${hit.map(r=>r.key).join(',')}">改停產</button></div>`; })()}
    ${(()=>{ const fp=fpOf(g); const hit=g.rows.filter(r=>!r.hidden&&rst(r)==='入庫'&&(m=>m&&m.discontinued)(fpMatch(r,fp))); return hit.length?`<div class="hint" style="color:var(--amber);border:1px solid var(--amber);border-radius:8px;padding:6px 10px;margin-bottom:8px">原廠已標停產（料號帶 *）但我們還是入庫：${hit.map(r=>esc(nm(r.model))).join('、')} <button class="btn sm" id="stAutoLtd" data-keys="${hit.map(r=>r.key).join(',')}" style="margin-left:8px">一鍵改限量</button></div>`:''; })()}
    <div class="field" style="margin-bottom:6px"><label>套用到</label><div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px">${g.rows.filter(r=>!r.hidden).map(r=>`<label style="display:inline-flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap;color:var(--text);font-size:12.5px;margin:0"><input type="checkbox" class="stRow" value="${r.key}" checked> ${esc(nm(r.model))} <span class="tag ${ST_CLS[rst(r)]||''}" style="font-size:10px">${esc(rst(r))}</span></label>`).join('')}</div></div>
    <div class="field"><label>狀態</label><select id="stSel">${['入庫','期貨','限量','停產'].map(x=>`<option${st===x?' selected':''}>${x}</option>`).join('')}</select></div>
    <div class="sub2${st==='限量'||st==='停產'?' on':''}" id="sub2"><div class="field"><label>原因</label><select id="stReason">${REASONS.map(x=>`<option${r0.status_reason===x?' selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>日期</label><input id="stOn" inputmode="numeric" maxlength="10" placeholder="YYYY-MM-DD（直接打 8 個數字）" value="${esc(r0.status_on||'')}"></div><div class="field"><label>備註（庫存量、何時出完…）</label><input id="stNote" value="${esc(r0.status_note||'')}"></div></div>
    <div class="actions" style="margin-top:8px"><button class="btn pri sm" id="stSave">儲存狀態</button> <span class="st" id="stMsg"></span></div>
    <div class="docs" style="margin-top:12px"><label style="font-size:11px;color:var(--teal2)">原廠通知／文件</label>${docs.map(d=>`<div class="d"><span class="tag">${esc(d.kind)}</span><a href="#" data-doc="${esc(d.path)}">${esc(d.title||d.path.split('/').pop())}</a><span class="sub">${esc(d.noted_on||'')}${d.factory_code?'':' · 整系列'}</span><span class="x" data-deldoc="${d.id}" title="移除">✕</span></div>`).join('')||'<div class="hint">還沒有文件</div>'}
      <div style="display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap"><select id="docKind" style="width:auto"><option>停產通知</option><option>價格通知</option><option>技術文件</option><option>其他</option></select><label class="hint" style="margin:0"><input type="checkbox" id="docSeries"> 整個系列</label><input type="file" id="docFile" accept="application/pdf,image/*" style="font-size:12px"></div></div></div>`:''}`;
  bindSide(g,st); }
function editForm(r){ if(!r) return ''; return `<div class="edit" id="editBox"><div class="field"><label>型號</label><input id="eModel" value="${esc(r.model)}"></div><div class="field"><label>中文名</label><input id="eName" value="${esc(r.import_name||'')}"></div><div class="field"><label>原廠名稱</label><input id="eFc" value="${esc(r.factory_code||'')}"></div><div class="field"><label>原廠料號</label><input id="eFi" value="${esc(r.factory_item||'')}"></div><div class="field"><label>尺寸</label><input id="eSize" value="${esc(r.size||'')}"></div><div class="field"><label>厚度</label><input id="eTh" value="${esc(r.thickness||'')}"></div><div class="field"><label>面感</label><input id="eFin" value="${esc(r.finish||'')}"></div><div class="field"><label>換縮圖（選檔上傳，取代雲端這張）</label><input id="eImg" type="file" accept="image/*"></div><div class="full actions"><button class="btn pri sm" id="eSave">儲存</button> <button class="btn sm" id="eCancel">取消</button> <span class="st" id="eMsg"></span><span class="hint" style="margin-left:10px">改過的列爬蟲不會再覆蓋</span></div></div>`; }
function bindSide(g,st){
  $('#stSel')?.addEventListener('change',e=>$('#sub2').classList.toggle('on',e.target.value==='限量'||e.target.value==='停產'));
  document.querySelectorAll('.stQuick').forEach(b=>b.addEventListener('click',async()=>{ const keys=b.dataset.keys.split(','); const upd={status:b.dataset.st,status_reason:'原廠停產通知',status_on:new Date(Date.now()+288e5).toISOString().slice(0,10),status_note:'原廠官網已下架'}; const {error}=await sb.from('products').update(upd).in('key',keys); if(error){ alert(error.message); return; } g.rows.filter(r=>keys.includes(r.key)).forEach(r=>Object.assign(r,upd)); render(); }));
  $('#stAutoLtd')?.addEventListener('click',async()=>{ const keys=$('#stAutoLtd').dataset.keys.split(','); const upd={status:'限量',status_reason:'原廠停產通知',status_on:new Date().toISOString().slice(0,10),status_note:'原廠官網料號標 *'}; const {error}=await sb.from('products').update(upd).in('key',keys); if(error){ alert(error.message); return; } g.rows.filter(r=>keys.includes(r.key)).forEach(r=>Object.assign(r,upd)); render(); });
  $('#stSave')?.addEventListener('click',async()=>{ const st=$('#stSel').value; const sub=st==='限量'||st==='停產'; const upd={status:st,status_reason:sub?$('#stReason').value:null,status_on:sub?(/^\d{4}-\d{2}-\d{2}$/.test($('#stOn').value)&&!isNaN(Date.parse($('#stOn').value))?$('#stOn').value:null):null,status_note:sub?($('#stNote').value||null):null};
    const keys=[...document.querySelectorAll('.stRow:checked')].map(x=>x.value); if(!keys.length){ $('#stMsg').className='st err'; $('#stMsg').textContent='沒有勾選型號'; return; }
    const {error}=await sb.from('products').update(upd).in('key',keys); if(error){ $('#stMsg').className='st err'; $('#stMsg').textContent=error.message; return; } g.rows.filter(r=>keys.includes(r.key)).forEach(r=>Object.assign(r,upd)); $('#stMsg').className='st ok'; $('#stMsg').textContent='已存'; render(); });
  document.querySelectorAll('[data-edit]').forEach(x=>x.addEventListener('click',()=>{ EDIT=x.dataset.edit; renderSide(); }));
  document.querySelectorAll('[data-hide]').forEach(x=>x.addEventListener('click',async()=>{ const r=ROWS.find(k=>k.key===x.dataset.hide); if(!confirm(`隱藏「${r.model} ${r.size||''}」？（不刪，爬蟲也不會再顯示）`)) return; const {error}=await sb.from('products').update({hidden:true,edited_at:new Date().toISOString()}).eq('key',r.key); if(error){ alert(error.message); return; } ROWS=ROWS.filter(k=>k.key!==r.key); render(); }));
  $('#gImg')?.addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f) return; let n=0; for(const r of g.rows){ const up=await sb.storage.from('finder').upload(`catalog/${r.key}.jpg`,f,{upsert:true,contentType:f.type}); if(up.error){ alert('圖上傳失敗：'+up.error.message); return; } const url=`${SB_URL}/storage/v1/object/public/finder/catalog/${r.key}.jpg?v=${Date.now()}`; await sb.from('products').update({image_url:url,edited_at:new Date().toISOString()}).eq('key',r.key); r.image_url=url; n++; } render(); });
  $('#eCancel')?.addEventListener('click',()=>{ EDIT=null; renderSide(); });
  $('#eSave')?.addEventListener('click',async()=>{ const r=ROWS.find(k=>k.key===EDIT); const upd={model:$('#eModel').value.trim(),import_name:$('#eName').value.trim()||null,factory_code:$('#eFc').value.trim()||null,factory_item:$('#eFi').value.trim()||null,size:$('#eSize').value.trim()||null,thickness:$('#eTh').value.trim()||null,finish:$('#eFin').value.trim()||null,edited_at:new Date().toISOString()};
    const f=$('#eImg').files[0]; if(f){ const up=await sb.storage.from('finder').upload(`catalog/${r.key}.jpg`,f,{upsert:true,contentType:f.type}); if(up.error){ $('#eMsg').className='st err'; $('#eMsg').textContent='圖上傳失敗：'+up.error.message; return; } upd.image_url=`${SB_URL}/storage/v1/object/public/finder/catalog/${r.key}.jpg?v=${Date.now()}`; }
    const {error}=await sb.from('products').update(upd).eq('key',r.key); if(error){ $('#eMsg').className='st err'; $('#eMsg').textContent=error.message; return; } Object.assign(r,upd); EDIT=null; render(); });
  document.querySelectorAll('[data-lb]').forEach(el=>el.addEventListener('click',e=>{ e.preventDefault(); const box=el.closest('.thumbs,.hero')||el.parentElement; const els=[...box.querySelectorAll('[data-lb]')]; LB=els.map(x=>({u:x.dataset.lb,c:x.dataset.cap||''})); lbShow(Math.max(0,els.indexOf(el))); }));
  document.querySelectorAll('[data-copy]').forEach(x=>x.addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(x.dataset.copy); x.textContent='已複製'; setTimeout(()=>x.textContent='複製路徑',1500); }catch(e){ prompt('複製這段：',x.dataset.copy); } }));
  document.querySelectorAll('[data-fdel]').forEach(x=>x.addEventListener('click',e=>{ e.stopPropagation(); const g=curGroup(); if(!g) return; const arr=fpTex(g).filter(u=>u!==x.dataset.fdel); fpSetTextures(g,arr); }));
  caiBind();
  $('#stOn')?.addEventListener('input',e=>{ const d=e.target.value.replace(/\D/g,'').slice(0,8); e.target.value=d.length>6?d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6):d.length>4?d.slice(0,4)+'-'+d.slice(4):d; });
  $('#sideX')?.addEventListener('click',()=>{ const k=SEL; SEL=null; EDIT=null; render(); document.querySelectorAll('.tile').forEach(t=>{ if(t.dataset.k===k) t.scrollIntoView({block:'center'}); }); });
  $('#fxTgl')?.addEventListener('click',e=>{ e.preventDefault(); FX_OPEN=!FX_OPEN; renderSide(); });
  document.querySelectorAll('[data-fadd]').forEach(x=>x.addEventListener('click',()=>{ const g=curGroup(); if(!g) return; const u=prompt('原廠圖片網址（在原廠頁對圖片按右鍵 → 複製圖片位址）'); if(!u||!/^https?:\/\//.test(u)) return; fpSetTextures(g,[...(fpTex(g)),u.trim()]); }));
  document.querySelectorAll('[data-hidepdf]').forEach(x=>x.addEventListener('click',async()=>{ HID.add(x.dataset.hidepdf); await sb.from('ui_state').upsert({user_id:UID,key:'catalog',data:{hiddenPdfs:[...HID]}},{onConflict:'user_id,key'}); renderSide(); }));
  $('#docFile')?.addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f) return; const wholeSeries=$('#docSeries').checked; const path=`${g.b0}/${g.series}/${wholeSeries?'_series':g.en}/${Date.now()}_${f.name}`.replace(/[^\w\u4e00-\u9fff./ -]/g,'_');
    const up=await sb.storage.from('catalog-docs').upload(path,f,{upsert:true}); if(up.error){ alert('上傳失敗：'+up.error.message+'（請先跑 supabase_44）'); return; }
    const {data,error}=await sb.from('product_docs').insert({vendor:g.vendor,brand:g.b0,series:g.series,factory_code:wholeSeries?null:g.en,kind:$('#docKind').value,title:f.name,path,noted_on:new Date().toISOString().slice(0,10)}).select().single(); if(error){ alert(error.message); return; } DOCS.unshift(bfix(data)); renderSide(); });
  document.querySelectorAll('[data-doc]').forEach(a=>a.addEventListener('click',async e=>{ e.preventDefault(); const {data,error}=await sb.storage.from('catalog-docs').createSignedUrl(a.dataset.doc,600); if(error){ alert(error.message); return; } window.open(data.signedUrl,'_blank'); }));
  document.querySelectorAll('[data-deldoc]').forEach(x=>x.addEventListener('click',async()=>{ if(!confirm('移除這份文件？')) return; const id=+x.dataset.deldoc; const d=DOCS.find(k=>k.id===id); await sb.storage.from('catalog-docs').remove([d.path]); await sb.from('product_docs').delete().eq('id',id); DOCS=DOCS.filter(k=>k.id!==id); renderSide(); })); }
['q','fSt','fFin','fTh','fSz','fCat','fTier','fLtd','fFut','fGreen','fSlip'].forEach(id=>$('#'+id).addEventListener('input',()=>{ SEL=null; render(); }));
const DEF=()=>{ ['fFin','fTh','fSz','fCat','fGreen','fSlip'].forEach(id=>$('#'+id).value=''); $('#fSt').value='入庫'; $('#fTier').value='常態'; $('#fLtd').checked=false; $('#fFut').checked=true; };   // 預設只看「常態品牌 × 入庫」
$('#fClear').addEventListener('click',()=>{ ['fSt','fFin','fTh','fSz','fCat','fTier','fGreen','fSlip'].forEach(id=>$('#'+id).value=''); $('#fLtd').checked=false; $('#fFut').checked=true; render(); });
$('#fDef').addEventListener('click',()=>{ DEF(); render(); });
$('#fh').addEventListener('click',()=>$('#filt').classList.toggle('closed'));
let LB=[],LBI=0;   // 燈箱：同一排的圖可以左右切換；第一張往左＝最後一張
function lbShow(i){ if(!LB.length) return; LBI=(i+LB.length)%LB.length; const x=LB[LBI]; $('#lbImg').src=x.u; $('#lbCap').textContent=x.c+(LB.length>1?`　${LBI+1}／${LB.length}`:''); $('#lbOpen').href=x.u; $('#lbPrev').style.display=$('#lbNext').style.display=LB.length>1?'':'none'; $('#lb').classList.add('on'); }
$('#lbPrev').addEventListener('click',e=>{ e.stopPropagation(); lbShow(LBI-1); }); $('#lbNext').addEventListener('click',e=>{ e.stopPropagation(); lbShow(LBI+1); });
document.addEventListener('keydown',e=>{ if(!$('#lb').classList.contains('on')) return; if(e.key==='ArrowLeft') lbShow(LBI-1); else if(e.key==='ArrowRight') lbShow(LBI+1); else if(e.key==='Home') lbShow(0); else if(e.key==='End') lbShow(LB.length-1); });
$('#lbX').addEventListener('click',()=>$('#lb').classList.remove('on')); $('#lb').addEventListener('click',e=>{ if(e.target.id==='lb') $('#lb').classList.remove('on'); }); document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#lb').classList.remove('on'); });
sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') location.reload(); });
boot();
</script>
</body></html>
