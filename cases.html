<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1012">
<title>ATLAS 案件中心 v2.5</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');
:root{--bg:#0e1012;--sb:#141618;--panel:#1a1d21;--card:#1f2328;--border:#2a2f36;--border2:#353b44;--gold:#d4a843;--gold2:#f0cc7a;--teal:#3aaa8c;--teal2:#4dc9a8;--red:#e06c6c;--indigo:#7b8cff;--amber:#e8b04a;--text:#dde2ee;--sub:#8a94a6;--muted:#4a5566}
@media (min-width:1600px){html{zoom:1.1}}@media (min-width:2200px){html{zoom:1.25}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;overflow-x:hidden}
.mono{font-family:'Space Mono',monospace}
button,input,textarea,select{font-family:inherit;font-size:inherit}
a{color:var(--teal2)}

#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 26px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;text-decoration:none;color:inherit}
.brand .mark{font-family:'Space Mono',monospace;letter-spacing:.3em;color:var(--gold);font-size:12px}
.brand h1{font-size:20px;font-weight:700}
.login-box p{color:var(--sub);font-size:12.5px;margin-bottom:20px}
.field{margin-bottom:12px;min-width:0}
.field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;letter-spacing:.06em}
.field label b{color:var(--red);font-weight:400}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{min-height:90px;resize:vertical;line-height:1.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:8px;border:1px solid var(--border2);background:var(--card);color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:700}
.btn.pri:hover{background:var(--gold2)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:6px}
.btn.w{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:18px}

#app{display:none;height:100%;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sb);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;min-width:0}
.topbar .brand{margin:0}.topbar .brand h1{font-size:15px}
.tabs{display:flex;gap:4px}
.tab{padding:6px 12px;border-radius:7px;border:1px solid transparent;background:none;color:var(--sub);cursor:pointer;font-size:12.5px}
.tab.on{color:var(--gold2);border-color:var(--border2);background:var(--panel)}
.spacer{flex:1}
.cloud{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap}
.cloud i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.cloud i.ok{background:var(--teal2)}.cloud i.wait{background:var(--amber)}.cloud i.err{background:var(--red)}

.main{flex:1;display:flex;min-height:0}
.list{width:clamp(300px,28vw,420px);flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:var(--sb);display:flex;flex-direction:column}
.list .tools{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--sb);z-index:2}
.list .tools input,.list .tools select{padding:7px 10px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none;min-width:0}
.list .tools input{flex:1;min-width:120px}
.tree .g1{padding:9px 12px 5px;font-size:11px;letter-spacing:.12em;color:var(--sub);cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:52px;background:var(--sb);z-index:1}
.tree .g1 .c{font-family:'Space Mono',monospace;color:var(--muted);margin-left:auto;font-size:10px}
.tree .g2{padding:6px 12px 4px 20px;font-size:12px;color:var(--text);cursor:pointer;display:flex;gap:6px;align-items:center;background:var(--panel)}
.tree .g2 .c{font-family:'Space Mono',monospace;color:var(--muted);margin-left:auto;font-size:10px}
.tree .ar{display:inline-block;width:10px;font-size:9px;color:var(--muted);transition:transform .15s}.tree .closed .ar{transform:rotate(-90deg)}
.tree .g3{padding:5px 12px 3px 30px;font-size:11.5px;color:var(--sub);cursor:pointer;display:flex;gap:6px;align-items:center}
.tree .g3 .c{font-family:'Space Mono',monospace;color:var(--muted);margin-left:auto;font-size:10px}
.tree .row{padding-left:40px}.tree .row .rel{font-size:11px;color:var(--muted)}
.row{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;border-left:2px solid transparent}
.row:hover{background:var(--panel)}
.row.active{background:var(--card);border-left-color:var(--gold)}
.row .n{font-size:13.5px;font-weight:500;display:flex;gap:8px;align-items:baseline}
.row .n .id{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)}
.row .m{font-size:11.5px;color:var(--sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:10.5px;padding:1px 7px;border-radius:5px;border:1px solid var(--border2);color:var(--sub);white-space:nowrap}
.pill.k1{border-color:var(--indigo);color:var(--indigo)}.pill.k2{border-color:var(--amber);color:var(--amber)}
.pill.st{border-color:var(--teal);color:var(--teal2)}
.empty{color:var(--muted);text-align:center;padding:50px 20px;font-size:13px}

.detail{flex:1;overflow-y:auto;padding:22px 26px}
.d-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.d-head h2{font-size:20px;font-weight:700}
.d-head .id{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;max-width:860px}
.grid .full{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--sub);cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#06211a;font-weight:600}
.chip.add{border-style:dashed}
.actions{display:flex;gap:10px;align-items:center;margin:16px 0 26px;max-width:860px}
.actions .st{flex:1;font-size:12px;color:var(--sub)}
.actions .st.ok{color:var(--teal2)}.actions .st.err{color:var(--red)}
.sec{max-width:860px;border-top:1px solid var(--border);padding-top:14px;margin-top:6px}
.sec h3{font-size:12px;color:var(--sub);letter-spacing:.12em;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.sec h3 .spacer{flex:1}
.it{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.it .x{color:var(--muted);cursor:pointer;font-size:12px;margin-left:auto}
.it .x:hover{color:var(--red)}
.it .sub{color:var(--sub);font-size:12px}
.it.done .t{color:var(--muted);text-decoration:line-through}
.it .cb{width:15px;height:15px;border:1px solid var(--border2);border-radius:4px;cursor:pointer;flex-shrink:0;position:relative}
.it.done .cb{background:var(--teal);border-color:var(--teal)}
.it.done .cb::after{content:'✓';color:#fff;font-size:10px;position:absolute;left:2px;top:-3px}
.addrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.addrow input,.addrow select{padding:7px 10px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none;min-width:0}
.addrow input{flex:1;min-width:140px}


/* 地號與所有權人 */
.pcl{border:1px solid var(--border);border-radius:9px;margin-bottom:8px;overflow:hidden}
.pcl .ph{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);font-size:13px;flex-wrap:nowrap;min-height:34px}
.pcl .ph label{display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--sub);white-space:nowrap}
.pcl .ph .secn{white-space:nowrap}.pcl .ph b{white-space:nowrap}.pcl .ph .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.pcl .ph .x{white-space:nowrap}.pcl .ph .x[data-editpcl]{margin-left:auto;color:var(--sub)}
.pcl .ph .hd{color:var(--muted);cursor:grab;font-size:13px;letter-spacing:-2px;user-select:none}.pcl .ph .hd:active{cursor:grabbing}
.pcl .ph .ar{display:inline-block;width:12px;font-size:9px;color:var(--muted);cursor:pointer;transition:transform .15s}.pcl.closed .ph .ar{transform:rotate(-90deg)}
.pm.tot{display:flex;flex-wrap:wrap;column-gap:20px;row-gap:4px;padding:5px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:12px;align-items:center}.pm.tot .cell{display:flex;align-items:center;gap:6px;white-space:nowrap}.pm.tot .cell i{font-style:normal;font-size:10.5px;color:var(--muted)}.pm.tot .cell b{font-family:'Space Mono',monospace;font-weight:400}.pm.tot .cell b.bad{color:var(--red);font-weight:700}
.pcl .pm{display:flex;flex-wrap:wrap;column-gap:22px;row-gap:4px;gap:6px;padding:5px 10px 5px 40px;border-top:1px dashed var(--border);font-size:12px;align-items:center}
.pcl .pm .cell{display:flex;align-items:center;gap:6px;white-space:nowrap}.pcl .pm .cell i{font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.06em}.pcl .pm .cell b{font-family:'Space Mono',monospace;font-weight:400}
.pcl.closed .pb{display:none}.pcl.pub .ph .secn,.pcl.pub .ph b{color:var(--amber)}
.pcl.dragging{opacity:.4}.pcl.over{box-shadow:inset 0 2px 0 var(--gold)}.pcl.over-b{box-shadow:inset 0 -2px 0 var(--gold)}
@media (max-width:760px){ .pcl .pm{grid-template-columns:1fr 1fr;padding-left:10px} .pcl .ph{flex-wrap:wrap} }
.pcl .ph b{font-family:'Space Mono',monospace;font-weight:400}
.pcl .ph .sub{color:var(--sub);font-size:12px}
.pcl .ph .x{margin-left:auto;color:var(--muted);cursor:pointer;font-size:12px}.pcl .ph .x:hover{color:var(--red)}
.pcl .po{display:grid;grid-template-columns:1.2fr .8fr .9fr .9fr 1.6fr auto;gap:6px;align-items:center;padding:5px 10px;border-top:1px dashed var(--border);font-size:12.5px}
.pcl .po .nm{display:flex;align-items:center;gap:6px}
.pcl .pg{padding:4px 10px;font-size:11px;letter-spacing:.08em;color:var(--sub);background:var(--panel);border-top:1px dashed var(--border)}
.pcl .po .hd{color:var(--muted);cursor:grab;font-size:13px;user-select:none;padding:0 4px 0 0;letter-spacing:-2px}.pcl .po .hd:active{cursor:grabbing}
.pcl .po.dragging{opacity:.4}.pcl .po.over{box-shadow:inset 0 2px 0 var(--gold)}.pcl .po.over-b{box-shadow:inset 0 -2px 0 var(--gold)}
.pcl .po input{padding:3px 6px;font-size:12px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);min-width:0}
.pcl .po select{max-width:120px;padding:3px 6px;font-size:12px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text)}
.c-同意{color:var(--teal2)!important}.c-拒絕{color:var(--red)!important}.c-未同意{color:var(--amber)!important}
.pcl .po .x{color:var(--muted);cursor:pointer;font-size:12px}.pcl .po .x:hover{color:var(--red)}
.pcl .addrow{padding:6px 10px 8px;margin-top:0;border-top:1px dashed var(--border)}
.pcl .addrow input,.pcl .addrow select{padding:5px 8px;font-size:12.5px}
.pcl .pe{background:var(--bg);border-top:1px solid var(--border2)}
.ratio{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 10px;font-size:12.5px;color:var(--sub)}
.ratio b{font-family:'Space Mono',monospace;font-weight:400;color:var(--text);font-size:15px}
.ratio .ok b{color:var(--teal2)}
.chk{font-family:'Space Mono',monospace;font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--border2);color:var(--sub);white-space:nowrap}
.chk.bad{border-color:var(--red);color:var(--red);font-weight:700}.chk.good{border-color:var(--teal);color:var(--teal2)}
.ratio .r{padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
.autosv{font-size:11.5px;color:var(--muted);margin-left:6px}
.pt{border-collapse:collapse;font-size:12px;width:100%}.pt th{font-weight:500;color:var(--sub);text-align:left;padding:4px 6px;border-bottom:1px solid var(--border2)}.pt td{padding:3px 6px;border-bottom:1px dashed var(--border)}.pt input{width:100%;padding:3px 6px;font-size:12px;background:var(--bg);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-family:'Space Mono',monospace}
@media (max-width:760px){ .pcl .po{grid-template-columns:1fr 1fr;} }
@media (max-width:760px){
  .main{flex-direction:column}
  .list{width:100%;max-height:40vh;border-right:0;border-bottom:1px solid var(--border)}
  .detail{padding:14px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="brand"><span class="mark">▲ ATLAS</span><h1>案件中心</h1></div>
    <p>帷幄 · 僅限本人登入</p>
    <form id="loginForm">
      <div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>PASSWORD</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn pri w" id="loginBtn" type="submit">登入</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <a class="brand" href="index.html" title="回帷幄首頁"><span class="mark">▲ ATLAS</span><h1>案件中心</h1></a>
    <a class="btn sm" href="index.html">⌂ 首頁</a>
    <nav class="tabs">
      <button class="tab on" data-t="ur">都更案件</button>
      <button class="tab" data-t="jc">建材專案</button>
      <button class="tab" data-t="ct">聯絡人</button>
    </nav>
    <span class="spacer"></span>
    <span class="cloud"><i id="cloudDot"></i><span id="cloudTxt">—</span></span>
    <button class="btn sm" id="logoutBtn">登出</button>
  </div>
  <div class="main">
    <div class="list">
      <div class="tools">
        <input id="q" type="search" placeholder="搜尋…">
        <select id="fStage"></select>
        <button class="btn sm pri" id="btnNew">＋ 新增</button><button class="btn sm" id="btnPasteCt" style="display:none" title="貼二類謄本的所有權人清單到某一筆地號">📋 貼謄本</button><button class="btn sm" id="btnZr" style="display:none" title="使用分區容積率資料庫">分區容積</button>
      </div>
      <div id="rows"></div>
    </div>
    <div class="detail" id="detail"><div class="empty">左側選一筆，或按「＋ 新增」</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://riiflvhbxrnmzriwngjs.supabase.co', SB_KEY='sb_publishable_R69Hj9hcR5G4dp3Uz1J0PQ_1BabpwsN';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>d?String(d).slice(0,10):'';

// ── 選項（對應資料庫 enum / check）──
const UR_KIND=['都市更新','危老重建'];
const UR_STAGE=['0.潛在評估與產權調閱','1.意願整合中','2.更新單元劃定','3.成立更新會','W1.危老耐震初評與資格認定','W2.危老100%同意與簽約','W3.危老重建計畫報核','U1.都更擬訂事業計畫','U2.都更擬訂權利變換計畫','完成.取得建拆照'];
const UR_FLAGS=['產權調閱完成','合法建築物證明已取得','耐震初評完成','耐震詳評完成','危老資格認定通過','更新單元已劃定','事業概要核准','說明會已辦','海砂屋／輻射屋','公有地佔比高','有未登記建物'];
const UR_ROLE=['地主','地主代表/管委會','建築師/團隊','代書/估價師','其他'];
const JC_CAT=['指定','採購','規劃','結案'];
const CT_KIND=['地主/住戶','建築師/設計師','營造廠/工程行','建設公司/業主','合作夥伴/代書'];
const TASK_TAG=['送件審議','內部作業','協調會議','送樣','其他'];
const CONSENT=['未接觸','同意','未同意','拒絕'];
const LAND_USE=['建','田','旱','林','道','水','雜','—'];

// ── 狀態 ──
let UID=null, TAB='ur', CUR=null, DATA={ur:[],jc:[],ct:[],tasks:[],urc:[],jcc:[],pcl:[],po:[]};
let AUTOSAVE=null, EDIT_PCL=null, PASTE_PCL=null; const ADDOPEN=new Set();
let PCLOPEN=new Set(); try{ PCLOPEN=new Set(JSON.parse(localStorage.getItem('atlas-pcl-open')||'[]')); }catch(e){}
const pclSave=()=>{ try{ localStorage.setItem('atlas-pcl-open',JSON.stringify([...PCLOPEN])); }catch(e){} };
const T={
  ur:{table:'ur_projects',label:'都更案件',name:r=>r.name,sub:r=>[r.kind,r.consent_pct!=null?`同意 ${r.consent_pct}%`:'',r.site_area_m2?`${Number(r.site_area_m2).toLocaleString()} m²`:''].filter(Boolean),filterKey:'stage',filterOpts:UR_STAGE,filterLabel:'全部階段'},
  jc:{table:'jc_projects',label:'建材專案',name:r=>r.name,sub:r=>[r.builder_name,r.owner,(r.categories||[]).join('·'),fmtD(r.track_date)].filter(Boolean),filterKey:'_cat',filterOpts:JC_CAT,filterLabel:'全部類別'},
  ct:{table:'contacts',label:'聯絡人',name:r=>r.name,sub:r=>[r.relation,r.company,r.title,r.phone].filter(Boolean),filterKey:'kind',filterOpts:CT_KIND,filterLabel:'全部類型'},
};

// ── 登入 ──
$('#loginForm').addEventListener('submit',async e=>{ e.preventDefault(); $('#loginBtn').disabled=true; $('#loginErr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pw').value}); $('#loginBtn').disabled=false;
  if(error){ $('#loginErr').textContent='登入失敗：'+(error.message.includes('Invalid')?'帳號或密碼錯誤':error.message); return; } boot(); });
$('#logoutBtn').addEventListener('click',async()=>{ await sb.auth.signOut(); location.reload(); });
async function boot(){ const {data:{session}}=await sb.auth.getSession(); if(!session){ $('#login').style.display='flex'; $('#app').style.display='none'; return; }
  UID=session.user.id; $('#login').style.display='none'; $('#app').style.display='flex'; await loadAll(); await ctOrdLoad(); setTab(new URLSearchParams(location.search).get('t')||'ur'); }
function cloud(st,txt){ $('#cloudDot').className=st; $('#cloudTxt').textContent=txt; }

// ── 載入 ──
async function loadAll(){
  cloud('wait','載入中…');
  const [a,b,c,d,e,f,g,h,z]=await Promise.all([
    sb.from('ur_projects').select('*').order('updated_at',{ascending:false}),
    sb.from('jc_projects').select('*').order('updated_at',{ascending:false}),
    sb.from('contacts').select('*').order('name'),
    sb.from('tasks').select('*').eq('kind','案件').order('due_at',{ascending:true,nullsFirst:false}),
    sb.from('ur_project_contacts').select('*'),
    sb.from('jc_project_contacts').select('*'),
    sb.from('parcels').select('*').order('section').order('lot'),
    sb.from('parcel_owners').select('*').order('id'),
    sb.from('zoning_rules').select('*').is('effective_to',null).order('city').order('far_pct'),
  ]);
  const err=[a,b,c,d,e,f].find(x=>x.error)?.error; if(err){ cloud('err','讀取失敗：'+err.message); return; }

function renderUrTree(rows,searching,rowH){

// 樹的自訂順序（存 ui_state key=ct_tree）：cases=[案件名…]、groups={案件|類型:[群組…]}、people={案件|類型|群組:[id…]}
let CTORD={cases:[],groups:{},people:{}};
async function ctOrdLoad(){ const {data}=await sb.from('ui_state').select('data').eq('key','ct_tree').maybeSingle(); if(data?.data) CTORD={cases:[],groups:{},people:{},...data.data}; }
async function ctOrdSave(){ const {error}=await sb.from('ui_state').upsert({user_id:UID,key:'ct_tree',data:CTORD},{onConflict:'user_id,key'}); if(error) alert('順序儲存失敗：'+error.message); }
const ordSort=(arr,order,key)=>{ const idx=x=>{ const i=order.indexOf(key(x)); return i<0?1e9:i; }; return [...arr].sort((a,b)=>idx(a)-idx(b)); };
function renderCtTree(rows,searching){
  const tree={}; for(const c of rows) for(const cs of ctCases(c)){ const k=c.kind||'未分類', g=c.group_name||'未分組'; (((tree[cs]??={})[k]??={})[g]??=[]).push(c); }
  let cases=Object.keys(tree).sort((a,b)=>a==='未歸案'?1:b==='未歸案'?-1:a.localeCompare(b,'zh-Hant')); cases=ordSort(cases,CTORD.cases,x=>x);
  const cnt=o=>Object.values(o).reduce((a,v)=>a+(Array.isArray(v)?v.length:cnt(v)),0);
  const node=(cls,key,label,n,closed,drag)=>`<div class="${cls}${closed?' closed':''}" data-t="${esc(key)}"${drag?` draggable="true" data-dk="${esc(drag.k)}" data-dv="${esc(drag.v)}"`:''}>${drag?'<span class="hd" title="拖曳調整順序">⋮⋮</span>':''}<span class="ar">▼</span>${esc(label)}<span class="c">${n}</span></div>`;
  const rowH=(c,scope)=>`<div class="row${CUR&&CUR.id===c.id?' active':''}" data-id="${c.id}" draggable="true" data-dk="p:${esc(scope)}" data-dv="${c.id}"><div class="n"><span class="hd" title="拖曳調整順序">⋮⋮</span><span>${esc(c.name)}</span>${c.relation?`<span class="rel">${esc(c.relation)}</span>`:''}<span class="id">#${c.id}</span></div><div class="m">${[c.company,c.title,c.phone].filter(Boolean).map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div></div>`;
  return cases.map(cs=>{ const k1='c:'+cs, c1=!searching&&TOPEN.has(k1); const kinds=tree[cs];
    return node('g1',k1,cs,cnt(kinds),c1,{k:'c',v:cs})+(c1?'':[...CT_KIND,'未分類'].filter(k=>kinds[k]).map(k=>{ const k2='k:'+cs+'|'+k, c2=!searching&&TOPEN.has(k2); const groups=kinds[k]; const gscope=cs+'|'+k;
      let gs=Object.keys(groups).sort((a,b)=>a==='未分組'?1:b==='未分組'?-1:a.localeCompare(b,'zh-Hant')); gs=ordSort(gs,CTORD.groups[gscope]||[],x=>x);
      return node('g2',k2,k,cnt(groups),c2)+(c2?'':gs.map(g=>{ const k3='g:'+cs+'|'+k+'|'+g, c3=!searching&&TOPEN.has(k3); const pscope=gscope+'|'+g; const people=ordSort(groups[g],CTORD.people[pscope]||[],x=>x.id);
        return node('g3',k3,g,groups[g].length,c3,{k:'g:'+gscope,v:g})+(c3?'':people.map(c=>rowH(c,pscope)).join('')); }).join('')); }).join('')); }).join('');
}
// 樹節點拖曳：同層同父才能互換；放開後把整層順序寫進 CTORD
function bindTreeDrag(){
  let D=null; const els=[...document.querySelectorAll('#rows [data-dk]')];
  els.forEach(el=>{
    el.addEventListener('mousedown',e=>{ el._hd=!!e.target.closest('.hd'); });
    el.addEventListener('dragstart',e=>{ if(!el._hd){ e.preventDefault(); return; } D=el; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',el.dataset.dv); }catch(_){} e.stopPropagation(); });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); els.forEach(x=>x.classList.remove('over','over-b')); D=null; });
    el.addEventListener('dragover',e=>{ if(!D||D===el||D.dataset.dk!==el.dataset.dk) return; e.preventDefault(); e.stopPropagation(); const r=el.getBoundingClientRect(), b=(e.clientY-r.top)>r.height/2; el.classList.toggle('over',!b); el.classList.toggle('over-b',b); });
    el.addEventListener('dragleave',()=>el.classList.remove('over','over-b'));
    el.addEventListener('drop',async e=>{ if(!D||D===el||D.dataset.dk!==el.dataset.dk) return; e.preventDefault(); e.stopPropagation(); const after=el.classList.contains('over-b'); el.classList.remove('over','over-b');
      const dk=D.dataset.dk; const sib=els.filter(x=>x.dataset.dk===dk).map(x=>x.dataset.dv).filter(v=>v!==D.dataset.dv); let j=sib.indexOf(el.dataset.dv); if(after) j++; sib.splice(j,0,D.dataset.dv);
      if(dk==='c') CTORD.cases=sib; else if(dk.startsWith('g:')) CTORD.groups[dk.slice(2)]=sib; else if(dk.startsWith('p:')) CTORD.people[dk.slice(2)]=sib.map(Number);
      await ctOrdSave(); renderList(); });
  });
}

const frac=(n,d)=>d===1?'全部':`${n}/${d}`;
const fmtM2=x=>x==null?'—':Number(x).toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=x=>x==null||x===''?'':Number(x).toLocaleString('zh-TW');
const unN=x=>{ const t=String(x??'').replace(/[,，\s]/g,''); return t===''?null:Number(t); };
// 去重鍵：有聯絡人用聯絡人；否則用遮罩識別碼（二類謄本 F125*****3）；最後才用姓名（陳＊＊ 會撞名，所以謄本一定要填識別碼）
const ownerKey=o=>o.contact_id?'c'+o.contact_id:o.owner_key?'k'+o.owner_key.replace(/[＊*\s]/g,''):'n'+o.owner_name;
const maskKey=k=>k?esc(k):'';
function consentCalc(pid){
  const all=DATA.pcl.filter(p=>p.ur_project_id===pid&&p.in_site!==false);
  const siteAll=all.reduce((a,p)=>a+Number(p.area_m2||0),0);
  const pcls=all.filter(p=>!p.is_public); // 公有地：面積算基地，但同意比例免計
  const site=pcls.reduce((a,p)=>a+Number(p.area_m2||0),0), pubM2=siteAll-site;
  const names=new Set(), agree=new Set(); let agreeM2=0, sumOfficial=0, anyOfficial=false;
  for(const p of pcls){ if(p.owners_official!=null){ sumOfficial+=p.owners_official; anyOfficial=true; }
    for(const o of DATA.po.filter(o=>o.parcel_id===p.id)){ const k=ownerKey(o);
      names.add(k); if(o.consent==='同意'){ agree.add(k); agreeM2+=Number(p.area_m2||0)*o.share_num/o.share_den; } } }

function parseLots(text){
  const out=[]; for(let line of text.split(/\r?\n/)){ line=line.trim(); if(!line) continue;
    const m=line.match(/(\d{4})\s*[-－]?\s*(\d{4})(?!\d)/); if(!m) continue;
    const lot=m[1]+'-'+m[2]; const before=line.slice(0,m.index).trim(), after=line.slice(m.index+m[0].length).trim();

// ── PDF 直接放入：都更計算機（案件清單／單查地號）→ 文字層；沒有文字層就在瀏覽器 OCR ──
const PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', PDFJS_W='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js', TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

  await loadLib(PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_W;

  const renderTo=async(page,scale,top=0,h=1)=>{ const vp=page.getViewport({scale}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=Math.round(vp.height*h); const ctx=cv.getContext('2d'); ctx.translate(0,-Math.round(vp.height*top));
    await page.render({canvasContext:ctx,viewport:vp,intent:'print'}).promise; return cv; }; // intent:print → 不等 requestAnimationFrame，分頁在背景也能跑
  for(let i=1;i<=pdf.numPages;i++){ const page=await pdf.getPage(i); const tc=await page.getTextContent(); lines.push('⌘PAGE '+i); // 分頁標記：每頁各自解析
    const rows={}; for(const t of tc.items){ if(!t.str.trim()) continue; const y=Math.round(t.transform[5]/4); (rows[y]??=[]).push(t); }
    const txt=Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(t=>t.str).join(' ')).join('\n');
    lines.push(...txt.split('\n').filter(l=>/20\d{2}\/\d{1,2}\/\d{1,2}/.test(l))); // 頁首列印日期（文字層）
    if(/\d{8}|\d{4}-\d{4}|所有權人/.test(txt)){ lines.push(...txt.split('\n')); continue; }
    const w=await ocrWorker(m=>prog(`${file.name} 第 ${i}/${pdf.numPages} 頁 ${m}`));
    prog(`${file.name} 第 ${i}/${pdf.numPages} 頁沒有文字層，OCR 全頁…`);
    const a=await w.recognize(await renderTo(page,2.2)); lines.push(...a.data.text.split('\n'));
    prog(`${file.name} 第 ${i}/${pdf.numPages} 頁 OCR 地號清單（高解析）…`);
    const b=await w.recognize(await renderTo(page,4,0.62,0.38)); lines.push(...b.data.text.split('\n').map(l=>'⟂'+l)); } // ⟂＝高解析地號表，地號列只信這段
  return lines;
}

    if(r.lots.length>1){ caseInfo=r.caseInfo&&Object.values(r.caseInfo).some(v=>v!=null)?r.caseInfo:(caseInfo||pendingInfo); }

        <select data-consent="${o.id}" class="c-${o.consent}">${CONSENT.map(x=>`<option${x===o.consent?' selected':''}>${x}</option>`).join('')}</select><input data-onote="${o.id}" value="${esc(o.notes??'')}" placeholder="備註（條件、顧慮、聯絡紀錄）" title="離開欄位即儲存"><span class="x" data-delown="${o.id}" title="${esc([o.deed_no,fmtD(o.registered_on)].filter(Boolean).join(' · '))}">刪</span></div>`; }
    h+=full&&!ADDOPEN.has(p.id)?`<div class="addrow" style="padding:4px 10px"><span class="x" data-addopen="${p.id}" style="font-size:12px">＋ 再加所有權人</span></div>`:`<div class="addrow"><input data-ownname="${p.id}" list="dl-ct" placeholder="姓名（打字找聯絡人，或直接填新名字）" style="flex:1.6;min-width:160px"><input data-ownkey="${p.id}" placeholder="遮罩識別碼 F125*****3" style="flex:1;min-width:130px" title="二類謄本的遮罩統編，跨地號去重用；不要填完整統編"><input data-ownnum="${p.id}" type="number" min="1" placeholder="分子" style="flex:0 0 70px"><span style="align-self:center">／</span><input data-ownden="${p.id}" type="number" min="1" placeholder="分母" style="flex:0 0 70px"><select data-owncs="${p.id}">${CONSENT.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn sm" data-addown="${p.id}">加所有權人</button></div>`;
    h+=`</div></div>`;
  }
  h+=ctDatalist();
  h+=`<div style="margin-top:12px"><button class="btn sm pri" id="btnImpToggle">📄 放入 PDF 匯入地號${PDFQ.length?'（'+PDFQ.length+' 筆待寫入）':''}</button><span class="sub" style="font-size:12px;margin-left:8px">都更計算機「案件清單」或「單查地號」PDF，可多選；或貼文字</span>
    <div id="impBox" style="display:${PDFQ.length?'':'none'};margin-top:6px"><div class="addrow" style="margin:0 0 6px"><input type="file" id="impPdf" accept="application/pdf" multiple style="flex:1;padding:6px"><span class="sub" style="align-self:center;font-size:12px">可一次放多個：案件清單 PDF ＋ 各地號單查 PDF；沒文字層會自動 OCR（第一次要下載辨識模型，約 1 分鐘）</span></div><div id="pdfPrev"></div><textarea id="impTxt" style="width:100%;min-height:90px;font-family:'Space Mono',monospace;font-size:12px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);padding:8px" placeholder="五股區	五股段	05840000	947.61	自然人100%
0584-0000 土地15 建物24"></textarea><div class="addrow"><button class="btn sm pri" id="btnImp">匯入</button><span class="sub" id="impMsg" style="align-self:center;font-size:12px"></span></div></div></div>`;
  h+=`<div class="addrow" style="margin-top:10px"><input id="pSection" placeholder="地段（例：五股區五股段）" style="flex:1.4"><input id="pLot" placeholder="地號 0584-0000" style="flex:1"><input id="pArea" type="number" step="0.01" placeholder="面積 m²" style="flex:0 0 110px"><select id="pUse"><option value="">地目</option>${LAND_USE.map(x=>`<option>${x}</option>`).join('')}</select><input id="pReg" placeholder="地政所" style="flex:0 0 120px"><button class="btn sm" id="btnAddPcl">＋ 加地號</button></div></div>`;
  return h;
}
function bindHoldings(){
  const cid=CUR?.id; if(!cid||TAB!=='ct'||DATA.noParcels) return;
  $('#btnJoin')?.addEventListener('click',async()=>{ const t=$('#jCase').value.trim(); const m=t.match(/^(都更|建材) · (.+)$/); if(!m){ alert('請從清單選一個案件'); return; }
    if(m[1]==='都更'){ const u=DATA.ur.find(x=>x.name===m[2]); if(!u) return; const role=$('#jRole').value; if(DATA.urc.some(l=>l.ur_project_id===u.id&&l.contact_id===cid&&l.role===role)){ alert('已經加入過'); return; }
      const row={ur_project_id:u.id,contact_id:cid,role}; const {error}=await sb.from('ur_project_contacts').insert(row); if(error){ alert(error.message); return; } DATA.urc.push(row); }
    else { const u=DATA.jc.find(x=>x.name===m[2]); if(!u) return; if(DATA.jcc.some(l=>l.jc_project_id===u.id&&l.contact_id===cid)){ alert('已經加入過'); return; }
      const row={jc_project_id:u.id,contact_id:cid}; const {error}=await sb.from('jc_project_contacts').insert(row); if(error){ alert(error.message); return; } DATA.jcc.push(row); }
    showForm(); renderList(); });
  document.querySelectorAll('[data-onote]').forEach(x=>x.addEventListener('change',async()=>{ const id2=+x.dataset.onote; const o=DATA.po.find(k=>k.id===id2); const notes=x.value.trim()||null; if(notes===(o.notes||null)) return;
    const {error}=await sb.from('parcel_owners').update({notes}).eq('id',id2); if(error){ alert(error.message); return; } o.notes=notes; x.style.borderColor='var(--teal)'; setTimeout(()=>x.style.borderColor='',800); }));
  $('#btnHold')?.addEventListener('click',async()=>{ const t=$('#hPcl').value.trim(); const m=t.match(/(\d{4}-\d{4})\s*$/); const caseName=t.split(' · ')[0];
    const p=m&&DATA.pcl.find(p=>p.lot===m[1]&&(DATA.ur.find(u=>u.id===p.ur_project_id)?.name||'')===caseName); if(!p){ alert('請從清單選一個地號'); return; } const pidv=p.id;
    const n=+$('#hNum').value||1, d=+$('#hDen').value||1; if(n>d){ alert('分子不能大於分母'); return; }
    const row={parcel_id:pidv,contact_id:cid,owner_name:CUR.name,share_num:n,share_den:d,consent:$('#hCs').value,notes:$('#hNote').value.trim()||null,sort_order:DATA.po.filter(o=>o.parcel_id===pidv).length};
    const {data,error}=await sb.from('parcel_owners').insert(row).select().single(); if(error){ alert('加入失敗：'+error.message); return; } DATA.po.push(data); showForm(); });
  document.querySelectorAll('[data-delown]').forEach(x=>x.addEventListener('click',async()=>{ const id=+x.dataset.delown; if(!confirm('刪除這筆持分？')) return;
    const {error}=await sb.from('parcel_owners').delete().eq('id',id); if(error){ alert(error.message); return; } DATA.po=DATA.po.filter(o=>o.id!==id); showForm(); }));
  document.querySelectorAll('[data-consent]').forEach(x=>x.addEventListener('change',async()=>{ const id=+x.dataset.consent; const o=DATA.po.find(k=>k.id===id);
    const upd={consent:x.value}; if(x.value==='同意'&&!o.signed_on) upd.signed_on=new Date().toISOString().slice(0,10); if(x.value!=='同意') upd.signed_on=null;
    const {error}=await sb.from('parcel_owners').update(upd).eq('id',id); if(error){ alert(error.message); return; } Object.assign(o,upd); showForm(); }));
}
function bindParcels(){
  const pid=CUR?.id; if(!pid||TAB!=='ur'||DATA.noParcels) return;
  $('#btnImpToggle')?.addEventListener('click',()=>{ const b=$('#impBox'); b.style.display=b.style.display==='none'?'':'none'; });
  $('#impPdf')?.addEventListener('change',e=>{ const fs=[...e.target.files]; if(fs.length) pdfImport(fs,pid); });
  if(PDFQ.length) renderPdfPreview(pid,DATA.pcl.find(p=>p.ur_project_id===pid)?.section||'');
  $('#btnImp')?.addEventListener('click',async()=>{ const t=$('#impTxt').value.trim(); if(!t) return; $('#impMsg').textContent='匯入中…';
    const def=DATA.pcl.find(p=>p.ur_project_id===pid)?.section; const r=await importLots(pid,t,def); if(r.n) showForm(); else $('#impMsg').textContent=r.msg; if(r.n) setTimeout(()=>alert('匯入完成：'+r.msg),50); });
  $('#btnAddPcl')?.addEventListener('click',async()=>{
    const row={ur_project_id:pid,section:$('#pSection').value.trim(),lot:$('#pLot').value.trim(),area_m2:$('#pArea').value?Number($('#pArea').value):null,land_use:$('#pUse').value||null,registry:$('#pReg').value.trim()||null};
    if(!row.section||!row.lot){ alert('地段與地號必填'); return; }
    const {data,error}=await sb.from('parcels').insert(row).select().single(); if(error){ alert('加入失敗：'+error.message); return; } DATA.pcl.push(data); showForm(); });
  document.querySelectorAll('[data-editpcl]').forEach(x=>x.addEventListener('click',()=>{ EDIT_PCL=+x.dataset.editpcl; showForm(); }));
  document.querySelectorAll('[data-cancelpcl]').forEach(x=>x.addEventListener('click',()=>{ EDIT_PCL=null; showForm(); }));
  document.querySelectorAll('[data-savepcl]').forEach(b=>b.addEventListener('click',async()=>{ const id=+b.dataset.savepcl, w=document.querySelector(`[data-pe="${id}"]`), g=sel=>w.querySelector(sel).value.trim();
    const upd={section:g('[data-pe-section]'),lot:g('[data-pe-lot]'),area_m2:g('[data-pe-area]')?Number(g('[data-pe-area]')):null,land_use:g('[data-pe-use]')||null,zoning:g('[data-pe-zoning]')||null,zoning_status:g('[data-pe-zoning]')?(w.querySelector('[data-pe-zok]').checked?'已確認':'推定'):null,registry:g('[data-pe-reg]')||null,owners_official:g('[data-pe-own]')?Number(g('[data-pe-own]')):null,bldg_count:g('[data-pe-bcnt]')?Number(g('[data-pe-bcnt]')):null,bldg_floor_m2:g('[data-pe-bfloor]')?Number(g('[data-pe-bfloor]')):null,bldg_private_m2:g('[data-pe-bpriv]')?Number(g('[data-pe-bpriv]')):null,announced_value:unN(g('[data-pe-av]')),announced_price:unN(g('[data-pe-ap]')),bldg_owners_official:g('[data-pe-bown]')?Number(g('[data-pe-bown]')):null,notes:g('[data-pe-notes]')||null};
    if(!upd.section||!upd.lot){ alert('地段與地號必填'); return; }
    const {data,error}=await sb.from('parcels').update(upd).eq('id',id).select().single(); if(error){ alert('儲存失敗：'+error.message); return; }
    Object.assign(DATA.pcl.find(k=>k.id===id),data); EDIT_PCL=null; showForm(); }));
  document.querySelectorAll('[data-delpcl]').forEach(x=>x.addEventListener('click',async()=>{ const id=+x.dataset.delpcl; const p=DATA.pcl.find(k=>k.id===id);
    if(!confirm(`刪除地號 ${p.lot}？其所有權人持分一併刪除。`)) return;
    const {error}=await sb.from('parcels').delete().eq('id',id); if(error){ alert(error.message); return; } DATA.pcl=DATA.pcl.filter(k=>k.id!==id); DATA.po=DATA.po.filter(o=>o.parcel_id!==id); showForm(); }));
  document.querySelectorAll('[data-ispub]').forEach(x=>x.addEventListener('change',async()=>{ const id=+x.dataset.ispub;
    const {error}=await sb.from('parcels').update({is_public:x.checked}).eq('id',id); if(error){ alert(error.message); x.checked=!x.checked; return; } DATA.pcl.find(k=>k.id===id).is_public=x.checked; showForm(); }));
  document.querySelectorAll('[data-insite]').forEach(x=>x.addEventListener('change',async()=>{ const id=+x.dataset.insite;
    const {error}=await sb.from('parcels').update({in_site:x.checked}).eq('id',id); if(error){ alert(error.message); x.checked=!x.checked; return; } DATA.pcl.find(k=>k.id===id).in_site=x.checked; showForm(); }));
  let DRAG=null;
  document.querySelectorAll('.po[data-po]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ e.stopPropagation(); DRAG=el; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',el.dataset.po); }catch(_){} });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); document.querySelectorAll('.po.over,.po.over-b').forEach(x=>x.classList.remove('over','over-b')); DRAG=null; });
    el.addEventListener('dragover',e=>{ if(!DRAG||DRAG===el) return; e.stopPropagation(); if(DRAG.closest('.pcl')!==el.closest('.pcl')||DRAG.dataset.g!==el.dataset.g) return; e.preventDefault(); e.dataTransfer.dropEffect='move';
      const r=el.getBoundingClientRect(), b=(e.clientY-r.top)>r.height/2; el.classList.toggle('over',!b); el.classList.toggle('over-b',b); });
    el.addEventListener('dragleave',()=>el.classList.remove('over','over-b'));
    el.addEventListener('drop',async e=>{ if(!DRAG||DRAG===el) return; e.preventDefault(); e.stopPropagation(); const after=el.classList.contains('over-b'); el.classList.remove('over','over-b'); await dropOwner(+DRAG.dataset.po,+el.dataset.po,after); });
  });
  document.querySelectorAll('[data-addown]').forEach(b=>b.addEventListener('click',async()=>{ const id=+b.dataset.addown;
    const name=document.querySelector(`[data-ownname="${id}"]`).value.trim(); if(!name){ alert('請填姓名'); return; }
    const ct=findCt(name), cid=ct?ct.id:null;
    const n=+document.querySelector(`[data-ownnum="${id}"]`).value||1, d=+document.querySelector(`[data-ownden="${id}"]`).value||1;
    if(n>d){ alert('持分分子不能大於分母'); return; }
    const key=document.querySelector(`[data-ownkey="${id}"]`).value.trim().replace(/＊/g,'*')||null; if(key&&/^[A-Za-z][12]\d{8}$/.test(key)){ alert('這看起來是完整統一編號，依規則不存；請只填謄本上的遮罩格式'); return; }
    const row={parcel_id:id,contact_id:cid,owner_name:name,owner_key:key,share_num:n,share_den:d,consent:document.querySelector(`[data-owncs="${id}"]`).value,sort_order:DATA.po.filter(o=>o.parcel_id===id).length};
    const {data,error}=await sb.from('parcel_owners').insert(row).select().single(); if(error){ alert('加入失敗：'+error.message); return; } DATA.po.push(data); showForm(); }));
  document.querySelectorAll('[data-pcltgl]').forEach(x=>x.addEventListener('click',()=>{ const id=+x.dataset.pcltgl; PCLOPEN.has(id)?PCLOPEN.delete(id):PCLOPEN.add(id); pclSave(); showForm(); }));
  document.querySelectorAll('[data-addopen]').forEach(x=>x.addEventListener('click',()=>{ ADDOPEN.add(+x.dataset.addopen); showForm(); }));
  let PDRAG=null;
  document.querySelectorAll('.pcl[data-pcl]').forEach(el=>{
    el.addEventListener('mousedown',e=>{ el._fromHd=!!e.target.closest('.ph'); });
    el.addEventListener('dragstart',e=>{ if(!el._fromHd){ e.preventDefault(); return; } PDRAG=el; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain','pcl:'+el.dataset.pcl); }catch(_){} e.stopPropagation(); });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); document.querySelectorAll('.pcl.over,.pcl.over-b').forEach(x=>x.classList.remove('over','over-b')); PDRAG=null; });
    el.addEventListener('dragover',e=>{ if(!PDRAG||PDRAG===el) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; const r=el.getBoundingClientRect(), b=(e.clientY-r.top)>r.height/2; el.classList.toggle('over',!b); el.classList.toggle('over-b',b); });
    el.addEventListener('dragleave',()=>el.classList.remove('over','over-b'));
    el.addEventListener('drop',async e=>{ if(!PDRAG||PDRAG===el) return; e.preventDefault(); e.stopPropagation(); const after=el.classList.contains('over-b'); el.classList.remove('over','over-b');
      const list=pclsSorted(pid).filter(p=>p.id!==+PDRAG.dataset.pcl); const src=DATA.pcl.find(p=>p.id===+PDRAG.dataset.pcl); let j=list.findIndex(p=>p.id===+el.dataset.pcl); if(after) j++; list.splice(j,0,src);
      const ups=list.map((p,i)=>({id:p.id,sort_order:i+1})).filter(u=>DATA.pcl.find(p=>p.id===u.id).sort_order!==u.sort_order);
      const rs=await Promise.all(ups.map(u=>sb.from('parcels').update({sort_order:u.sort_order}).eq('id',u.id))); const err=rs.find(r=>r.error)?.error; if(err){ alert(err.message); return; }
      ups.forEach(u=>DATA.pcl.find(p=>p.id===u.id).sort_order=u.sort_order); showForm(); });
  });
  document.querySelectorAll('[data-pastetgl]').forEach(x=>x.addEventListener('click',()=>{ const id=+x.dataset.pastetgl; PASTE_PCL=PASTE_PCL===id?null:id; showForm(); }));
  document.querySelectorAll('[data-pasteadd]').forEach(b=>b.addEventListener('click',async()=>{ const id=+b.dataset.pasteadd; const txt=document.querySelector(`[data-pastetxt="${id}"]`).value; const msg=document.querySelector(`[data-pastemsg="${id}"]`);
    const rows=parseOwners(txt); if(!rows.length){ msg.textContent='沒解析到任何人'; return; }
    if(rows.some(r=>r.owner_key&&/^[A-Za-z][12]\d{8}$/.test(r.owner_key))){ msg.textContent='含完整統一編號，依規則不存，請改成遮罩格式'; return; }
    const have=DATA.po.filter(o=>o.parcel_id===id); let base=have.length, added=0, skipped=0; const ins=[];
    for(const r of rows){ const dup=have.find(o=>(r.owner_key&&o.owner_key&&o.owner_key.replace(/[*＊]/g,'')===r.owner_key.replace(/[*＊]/g,''))||(o.owner_name===r.owner_name&&!/＊/.test(r.owner_name))); if(dup){ skipped++; continue; }
      // 同識別碼在別的地號已連到聯絡人 → 一起連
      const same=r.owner_key?DATA.po.find(o=>o.contact_id&&o.owner_key&&o.owner_key.replace(/[*＊]/g,'')===r.owner_key.replace(/[*＊]/g,'')):null;
      ins.push({parcel_id:id,contact_id:same?.contact_id||null,owner_name:same?DATA.ct.find(c=>c.id===same.contact_id)?.name||r.owner_name:r.owner_name,owner_key:r.owner_key,share_num:r.share_num,share_den:r.share_den,consent:'未接觸',sort_order:base++,notes:r.hasShare?null:'持分未填（謄本沒讀到）'}); }
    if(ins.length){ const {data,error}=await sb.from('parcel_owners').insert(ins).select(); if(error){ msg.textContent='失敗：'+error.message; return; } DATA.po.push(...data); added=data.length; }
    PASTE_PCL=null; showForm(); setTimeout(()=>alert(`加入 ${added} 人${skipped?`，略過重複 ${skipped} 人`:''}`),50); }));
  document.querySelectorAll('[data-delown]').forEach(x=>x.addEventListener('click',async()=>{ const id=+x.dataset.delown; if(!confirm('刪除這筆持分？')) return;
    const {error}=await sb.from('parcel_owners').delete().eq('id',id); if(error){ alert(error.message); return; } DATA.po=DATA.po.filter(o=>o.id!==id); showForm(); }));
  document.querySelectorAll('[data-onote]').forEach(x=>x.addEventListener('change',async()=>{ const id=+x.dataset.onote; const o=DATA.po.find(k=>k.id===id); const notes=x.value.trim()||null; if(notes===(o.notes||null)) return;
    const {error}=await sb.from('parcel_owners').update({notes}).eq('id',id); if(error){ alert(error.message); return; } o.notes=notes; x.style.borderColor='var(--teal)'; setTimeout(()=>x.style.borderColor='',800); }));
  document.querySelectorAll('[data-consent]').forEach(x=>x.addEventListener('change',async()=>{ const id=+x.dataset.consent; const o=DATA.po.find(k=>k.id===id);
    const upd={consent:x.value}; if(x.value==='同意'&&!o.signed_on) upd.signed_on=new Date().toISOString().slice(0,10); if(x.value!=='同意') upd.signed_on=null;
    const {error}=await sb.from('parcel_owners').update(upd).eq('id',id); if(error){ alert(error.message); return; } Object.assign(o,upd); showForm(); }));
  $('#btnApplyRatio')?.addEventListener('click',()=>{ const c=consentCalc(pid), t=caseTotals(pid); const set=(id,v,dec)=>{ const el=$('#f-'+id); if(!el) return; el.value=v==null?'':(dec!=null?Number(v).toFixed(dec):v); };
    set('site_area_m2',c.siteAll||null,2); set('consent_pct',c.pctA,1); set('land_count',t.land_count); set('land_private_m2',t.land_private_m2,2); set('land_public_m2',t.land_public_m2,2);
    set('land_owners_times',t.land_owners_times); set('bldg_count',t.bldg_count); set('bldg_owners_official',t.bldg_owners_official); set('bldg_floor_m2',t.bldg_floor_m2,2); set('bldg_private_m2',t.bldg_private_m2,2);
    if(!Number(v('owners_official'))) set('owners_official',t.owners_keyed); if(!Number(v('consent_threshold'))) set('consent_threshold',75);
    save(); });
}

$('#detail').addEventListener('click',e=>{ const c=e.target.closest('.chip'); if(!c) return;
  if(c.dataset.add){ const t=prompt('自訂項目：'); if(t&&t.trim()){ const b=document.createElement('button'); b.type='button'; b.className='chip on'; b.dataset.v=t.trim(); b.textContent=t.trim(); c.before(b); if(CUR&&c.closest('.grid')) scheduleSave(); } return; }
  c.classList.toggle('on'); if(CUR&&c.closest('.grid')) scheduleSave(); });
sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') location.reload(); });
boot();
