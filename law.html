<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1012">
<title>ATLAS 法規條文庫 v1.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');
:root{
  --bg:#0e1012;--sb:#141618;--panel:#1a1d21;--card:#1f2328;--border:#2a2f36;--border2:#353b44;
  --gold:#d4a843;--gold2:#f0cc7a;--teal:#3aaa8c;--teal2:#4dc9a8;--red:#e06c6c;--indigo:#7b8cff;
  --text:#dde2ee;--sub:#8a94a6;--muted:#4a5566;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.mono{font-family:'Space Mono',monospace}
button,input,textarea,select{font-family:inherit;font-size:inherit}
a{color:var(--teal2)}

/* ── 登入 ── */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 26px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.brand .mark{font-family:'Space Mono',monospace;letter-spacing:.3em;color:var(--gold);font-size:12px}
.brand h1{font-size:20px;font-weight:700}
.login-box p{color:var(--sub);font-size:12.5px;margin-bottom:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;letter-spacing:.06em}
.field input{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);outline:none}
.field input:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--border2);background:var(--card);color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:700}
.btn.pri:hover{background:var(--gold2)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:6px}
.btn.w{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:18px}

/* ── 主畫面 ── */
#app{display:none;height:100%;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sb);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.topbar .brand{margin:0}
.topbar .brand h1{font-size:15px}
.spacer{flex:1}
.stat{font-size:11.5px;color:var(--sub)}
.stat b{color:var(--gold2);font-family:'Space Mono',monospace}

.toolbar{display:flex;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:8px 11px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none}
.toolbar input{flex:1;min-width:160px}
.toolbar input:focus{border-color:var(--gold)}
.toolbar select{min-width:120px}

.main{flex:1;display:flex;min-height:0}
.list{width:300px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:var(--sb)}
.law-group{border-bottom:1px solid var(--border)}
.law-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none;font-size:12.5px;font-weight:500}
.law-head:hover{background:var(--panel)}
.law-head .arrow{color:var(--muted);font-size:10px;transition:transform .15s}
.law-group.open .law-head .arrow{transform:rotate(90deg)}
.law-head .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-family:'Space Mono',monospace}
.law-head .pdf{font-size:10px;color:var(--gold2,#d8b35a);border:1px solid var(--gold2,#d8b35a);border-radius:4px;padding:0 5px;text-decoration:none}
.law-head .pdf:hover{background:var(--gold2,#d8b35a);color:#111}
.d-meta .pdf{color:var(--gold2,#d8b35a)}
.law-head .dl{font-size:10px;color:var(--muted);border:1px dashed var(--muted);border-radius:4px;padding:0 5px;text-decoration:none}
.law-head .dl:hover{color:var(--text);border-style:solid}
.law-head .ab{font-size:10px;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:0 4px}
.law-body{display:none}
.law-group.open .law-body{display:block}
.art-row{display:flex;gap:8px;align-items:baseline;padding:7px 12px 7px 30px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent}
.art-row:hover{background:var(--panel)}
.art-row.active{background:var(--card);border-left-color:var(--gold)}
.art-row .no{font-family:'Space Mono',monospace;color:var(--gold2);min-width:46px;font-size:11.5px}
.art-row .pv{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.art-row .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;opacity:0}
.art-row.noted .dot{opacity:1}

.detail{flex:1;overflow-y:auto;padding:22px 26px}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px}
.d-law{font-size:12px;color:var(--sub);letter-spacing:.06em}
.d-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.d-title h2{font-size:22px;font-weight:700}
.d-title h2 .mono{color:var(--gold2)}
.pill{font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid var(--border2);color:var(--sub)}
.pill.ok{border-color:var(--teal);color:var(--teal2)}
.pill.ab{border-color:var(--red);color:var(--red)}
.pill.asp{border-color:var(--indigo);color:var(--indigo)}
.d-meta{font-size:11.5px;color:var(--muted);margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap}
.d-content{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px;white-space:pre-wrap;line-height:1.95;font-size:14.5px;margin-bottom:20px}
.note-box{border:1px solid var(--gold);border-radius:10px;background:rgba(212,168,67,.05)}
.note-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(212,168,67,.3);font-size:12.5px;font-weight:500;color:var(--gold2)}
.note-head .hint{color:var(--sub);font-weight:400;font-size:11.5px}
.note-box textarea{width:100%;min-height:140px;padding:14px;background:transparent;border:0;color:var(--text);resize:vertical;outline:none;line-height:1.8}
.note-foot{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid rgba(212,168,67,.3)}
.note-foot .st{font-size:11.5px;color:var(--sub);flex:1}
.note-foot .st.ok{color:var(--teal2)}
.note-foot .st.err{color:var(--red)}

@media (max-width:700px){
  .main{flex-direction:column}
  .list{width:100%;max-height:42vh;border-right:0;border-bottom:1px solid var(--border)}
  .detail{padding:16px}
  .d-title h2{font-size:18px}
  .stat{display:none}
}
</style>
</head>
<body>

<!-- ═══ 登入 ═══ -->
<div id="login">
  <div class="login-box">
    <div class="brand"><span class="mark">▲ ATLAS</span><h1>法規條文庫</h1></div>
    <p>帷幄 · 僅限本人登入</p>
    <form id="loginForm">
      <div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>PASSWORD</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn pri w" id="loginBtn" type="submit">登入</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- ═══ 主畫面 ═══ -->
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="mark">▲ ATLAS</span><h1>法規條文庫</h1></div>
    <span class="stat">共 <b id="stTotal">0</b> 條 · <b id="stLaws">0</b> 部 · 已註記 <b id="stNoted">0</b></span>
    <span class="spacer"></span>
    <button class="btn sm" id="logoutBtn">登出</button>
  </div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="搜尋：條文內容、法規名稱、條號（如 27-1）…">
    <select id="fAspect">
      <option value="">全部面向</option>
      <option>A可行性</option><option>B容積獎勵</option><option>C權變估價</option>
      <option>D稅務</option><option>E產權土地</option><option>F程序組織</option><option>G建築執行</option>
    </select>
    <select id="fNoted">
      <option value="">全部條文</option>
      <option value="1">只看已註記</option>
    </select>
  </div>
  <div class="main">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"><div class="empty">左側選一條條文</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.min.js"></script>
<script>
// ═══════════════════════════════════════════════
// 設定：Publishable key 可公開；寫入權限由 Supabase RLS 控制
// ═══════════════════════════════════════════════
const SB_URL = 'https://riiflvhbxrnmzriwngjs.supabase.co';
const SB_KEY = 'sb_publishable_R69Hj9hcR5G4dp3Uz1J0PQ_1BabpwsN';
const sb = supabase.createClient(SB_URL, SB_KEY);

const $ = s => document.querySelector(s);
let ROWS = [], CUR = null, openLaws = new Set(), PDFS = new Set();

// ── 登入 ──
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginBtn').disabled = true; $('#loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
  $('#loginBtn').disabled = false;
  if (error) { $('#loginErr').textContent = '登入失敗：' + (error.message.includes('Invalid') ? '帳號或密碼錯誤' : error.message); return; }
  boot();
});
$('#logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ── 啟動 ──
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#login').style.display = 'flex'; $('#app').style.display = 'none'; return; }
  $('#login').style.display = 'none'; $('#app').style.display = 'flex';
  await load();
}
async function load() {
  $('#list').innerHTML = '<div class="empty">載入中…</div>';
  const { data, error } = await sb.from('law_articles')
    .select('article_id,law_name,law_code,article_no,article_sort,content,chapter,aspect,law_level,modified_date,source_url,status,my_note')
    .order('law_code').order('article_sort').range(0, 1999);
  if (error) { $('#list').innerHTML = `<div class="empty" style="color:var(--red)">讀取失敗：${error.message}</div>`; return; }
  ROWS = data; render();
  loadPdfList();
}
// ── PDF 原檔（Supabase Storage / law-pdf，私有，登入者可讀）──
async function loadPdfList() {
  try {
    const { data, error } = await sb.storage.from('law-pdf').list('', { limit: 500 });
    if (error) throw error;
    PDFS = new Set((data || []).map(f => f.name.replace(/\.pdf$/i, '')));
    if (PDFS.size) render();
  } catch (e) { console.warn('PDF 清單讀取失敗：', e.message); }
}
async function openPdf(code) {
  const { data, error } = await sb.storage.from('law-pdf').createSignedUrl(code + '.pdf', 3600);
  if (error) { alert('開啟失敗：' + error.message); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}

// ── 篩選 + 渲染 ──
function filtered() {
  const q = $('#q').value.trim().toLowerCase(), asp = $('#fAspect').value, noted = $('#fNoted').value;
  return ROWS.filter(r => {
    if (asp && r.aspect !== asp) return false;
    if (noted && !(r.my_note && r.my_note.trim())) return false;
    if (!q) return true;
    return (r.law_name + ' ' + r.article_no + ' ' + (r.content||'') + ' ' + (r.my_note||'')).toLowerCase().includes(q);
  });
}
function render() {
  const rows = filtered();
  $('#stTotal').textContent = ROWS.length;
  $('#stLaws').textContent = new Set(ROWS.map(r => r.law_code)).size;
  $('#stNoted').textContent = ROWS.filter(r => r.my_note && r.my_note.trim()).length;

  const byLaw = new Map();
  for (const r of rows) { if (!byLaw.has(r.law_code)) byLaw.set(r.law_code, { name: r.law_name, status: r.status, arts: [] }); byLaw.get(r.law_code).arts.push(r); }
  const searching = $('#q').value.trim() || $('#fNoted').value;
  let h = '';
  for (const [code, g] of byLaw) {
    const open = searching || openLaws.has(code);
    h += `<div class="law-group${open ? ' open' : ''}" data-code="${code}">
      <div class="law-head"><span class="arrow">▶</span><span>${g.name}</span>${g.status === '已廢止' ? '<span class="ab">廢止</span>' : ''}${PDFS.has(code) ? `<a class="pdf" data-pdf="${code}" title="開啟 PDF 原檔">📄 原檔</a>` : `<a class="dl" href="https://law.moj.gov.tw/LawClass/FilesType.aspx?DataId=${code}&md=m" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="到全國法規資料庫下載官方 PDF，存成 ${code}.pdf 後拖進 Supabase Storage / law-pdf">⬇ 官方</a>`}<span class="cnt">${g.arts.length}</span></div>
      <div class="law-body">${g.arts.map(r => `
        <div class="art-row${r.my_note && r.my_note.trim() ? ' noted' : ''}${CUR && CUR.article_id === r.article_id ? ' active' : ''}" data-id="${r.article_id}">
          <span class="no">§${r.article_no}</span><span class="pv">${(r.content||'').slice(0, 40)}</span><span class="dot"></span>
        </div>`).join('')}</div></div>`;
  }
  $('#list').innerHTML = h || '<div class="empty">沒有符合的條文</div>';
}
$('#list').addEventListener('click', e => {
  const pdf = e.target.closest('[data-pdf]');
  if (pdf) { e.stopPropagation(); openPdf(pdf.dataset.pdf); return; }
  const head = e.target.closest('.law-head');
  if (head) { const g = head.parentElement, c = g.dataset.code; g.classList.toggle('open'); g.classList.contains('open') ? openLaws.add(c) : openLaws.delete(c); return; }
  const row = e.target.closest('.art-row');
  if (row) show(ROWS.find(r => r.article_id === row.dataset.id));
});
['#q', '#fAspect', '#fNoted'].forEach(s => $(s).addEventListener('input', render));

// ── 條文詳情 + 註記 ──
function show(r) {
  CUR = r; openLaws.add(r.law_code);
  document.querySelectorAll('.art-row.active').forEach(x => x.classList.remove('active'));
  document.querySelector(`.art-row[data-id="${r.article_id}"]`)?.classList.add('active');
  const st = r.status === '已廢止' ? '<span class="pill ab">已廢止</span>' : r.status === '已修正待覆核' ? '<span class="pill">已修正待覆核</span>' : '<span class="pill ok">現行</span>';
  $('#detail').innerHTML = `
    <div class="d-law">${r.law_name} · ${r.law_code} · ${r.law_level || ''}</div>
    <div class="d-title"><h2>第 <span class="mono">${r.article_no}</span> 條</h2>${st}<span class="pill asp">${r.aspect || ''}</span></div>
    <div class="d-meta"><span>${r.chapter || ''}</span><span>修正 ${r.modified_date || '—'}</span><a href="${r.source_url}" target="_blank" rel="noopener">全國法規資料庫 ↗</a>${PDFS.has(r.law_code) ? `<a class="pdf" href="#" onclick="openPdf('${r.law_code}');return false">📄 PDF 原檔</a>` : ''}</div>
    <div class="d-content">${esc(r.content || '')}</div>
    <div class="note-box">
      <div class="note-head">★ 我的註記 <span class="hint">實務經驗、審議慣例、談判眉角 — 只有你看得到，同步永不覆蓋</span></div>
      <textarea id="note" placeholder="例：新北實務上這條會要求先……">${esc(r.my_note || '')}</textarea>
      <div class="note-foot"><span class="st" id="noteSt">${r.my_note ? '已儲存' : '尚無註記'}</span><button class="btn sm pri" id="saveNote">儲存註記</button></div>
    </div>`;
  $('#saveNote').addEventListener('click', saveNote);
  $('#note').addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') saveNote(); });
  if (window.innerWidth <= 700) $('#detail').scrollIntoView({ behavior: 'smooth' });
}
async function saveNote() {
  const st = $('#noteSt'), val = $('#note').value;
  st.className = 'st'; st.textContent = '儲存中…'; $('#saveNote').disabled = true;
  const { error } = await sb.from('law_articles').update({ my_note: val || null }).eq('article_id', CUR.article_id);
  $('#saveNote').disabled = false;
  if (error) { st.className = 'st err'; st.textContent = '儲存失敗：' + error.message; return; }
  CUR.my_note = val; st.className = 'st ok'; st.textContent = '✓ 已儲存 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  render();
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

boot();
</script>
</body>
</html>
