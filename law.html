<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f14">
<title>ATLAS 法規查詢 v0.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');
:root{
  --bg:#0d0f14; --panel:#161a22; --card:#1c2028; --border:#252c38;
  --ink:#e4e8f2; --ink2:#b2bacb; --muted:#6a7490;
  --gold:#d4a843; --teal:#3aaa8c;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);
     line-height:1.7;padding-bottom:60px;}
.bar{position:sticky;top:0;z-index:10;background:var(--panel);
     border-bottom:1px solid var(--border);padding:12px 16px;}
.brand{font-family:'Space Mono',monospace;font-size:13px;color:var(--gold);
       letter-spacing:1px;font-weight:700;}
.sub{font-size:11px;color:var(--muted);margin-top:2px;}
.wrap{max-width:820px;margin:0 auto;padding:16px;}
#q{width:100%;padding:12px 14px;font-size:16px;font-family:inherit;
   background:var(--card);border:1px solid var(--border);border-radius:8px;
   color:var(--ink);margin-bottom:6px;}
#q:focus{outline:none;border-color:var(--gold);}
.hint{font-size:11px;color:var(--muted);margin-bottom:14px;}
.status{font-size:12px;padding:10px 14px;border-radius:8px;margin-bottom:14px;
        background:var(--card);border:1px solid var(--border);color:var(--ink2);}
.status.ok{border-color:var(--teal);color:var(--teal);}
.status.err{border-color:#e07060;color:#e07060;}
.law{margin-bottom:10px;background:var(--card);border:1px solid var(--border);
     border-radius:10px;overflow:hidden;}
.law-h{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;
       align-items:center;gap:10px;}
.law-h:hover{background:#22262f;}
.law-n{font-size:14px;font-weight:700;}
.law-m{font-size:11px;color:var(--muted);margin-top:3px;}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;flex-shrink:0;
     background:rgba(212,168,67,.15);color:var(--gold);}
.arts{display:none;border-top:1px solid var(--border);}
.arts.open{display:block;}
.art{padding:12px 14px;border-bottom:1px solid #1f242e;}
.art:last-child{border-bottom:none;}
.art-n{font-family:'Space Mono',monospace;font-size:12px;color:var(--gold);
       font-weight:700;margin-bottom:4px;}
.art-c{font-size:13.5px;color:var(--ink2);}
.art-ch{font-size:10px;color:var(--muted);margin-top:5px;}
mark{background:rgba(212,168,67,.3);color:var(--ink);border-radius:2px;}
.foot{text-align:center;font-size:10px;color:var(--muted);padding:24px 16px;line-height:1.8;}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">▲ ATLAS 法規查詢</div>
  <div class="sub">發布層測試版 v0.1 · 靜態 JSON</div>
</div>

<div class="wrap">
  <input id="q" placeholder="輸入關鍵字或條號，例如：權利變換、27" autocomplete="off">
  <div class="hint">資料來源：全國法規資料庫 · 正式引用請以官方公告為準</div>
  <div id="status" class="status">載入中…</div>
  <div id="list"></div>
</div>

<div class="foot">
  ATLAS 帷幄 · 法規文件庫<br>
  本頁為靜態資料，可離線瀏覽
</div>

<script>
const BASE = './data/laws/';
let LAWS = [], CACHE = {};
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function setStatus(msg, cls){ const el=$('status'); el.textContent=msg; el.className='status '+(cls||''); }

async function init(){
  const t0 = performance.now();
  try{
    const r = await fetch(BASE+'index.json', {cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    LAWS = d.laws || [];
    const ms = Math.round(performance.now()-t0);
    setStatus(`已載入 ${LAWS.length} 部法規 · ${ms} ms`, 'ok');
    render();
  }catch(e){
    setStatus('載入失敗：'+e.message+'（請確認 data/laws/index.json 存在）', 'err');
  }
}

async function loadLaw(pcode, file){
  if(CACHE[pcode]) return CACHE[pcode];
  const r = await fetch(BASE+file, {cache:'no-cache'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d = await r.json();
  CACHE[pcode] = d;
  return d;
}

function hl(text, kw){
  if(!kw) return esc(text);
  const t = esc(text), k = esc(kw);
  try{ return t.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`); }
  catch(e){ return t; }
}

function render(){
  const kw = $('q').value.trim();
  $('list').innerHTML = LAWS.map((L,i)=>`
    <div class="law">
      <div class="law-h" onclick="toggle(${i})">
        <div>
          <div class="law-n">${esc(L.name)}</div>
          <div class="law-m">${esc(L.pcode)} · ${esc(L.level||'')} · 修正 ${esc(L.amended_date||'未匯入')}</div>
        </div>
        <span class="tag">${esc(L.category||'')}</span>
      </div>
      <div class="arts" id="a${i}"></div>
    </div>`).join('');
  if(kw) LAWS.forEach((L,i)=>expand(i,true));
}

async function toggle(i){
  const box = $('a'+i);
  if(box.classList.contains('open')){ box.classList.remove('open'); return; }
  expand(i);
}

async function expand(i, keepClosed){
  const L = LAWS[i], box = $('a'+i), kw = $('q').value.trim();
  try{
    if(!box.dataset.loaded){
      box.innerHTML = '<div class="art"><div class="art-c">載入中…</div></div>';
      box.classList.add('open');
      const d = await loadLaw(L.pcode, L.data_file);
      box.dataset.arts = JSON.stringify(d.articles||[]);
      box.dataset.loaded = '1';
    }
    let arts = JSON.parse(box.dataset.arts||'[]');
    if(kw) arts = arts.filter(a => (a.content||'').includes(kw) || (a.no||'')===kw);
    if(!arts.length){
      if(kw && keepClosed){ box.classList.remove('open'); box.innerHTML=''; return; }
      box.innerHTML = '<div class="art"><div class="art-c">無符合條文</div></div>';
    }else{
      box.innerHTML = arts.map(a=>`
        <div class="art">
          <div class="art-n">第 ${esc(a.no)} 條</div>
          <div class="art-c">${hl(a.content, kw)}</div>
          ${a.chapter?`<div class="art-ch">${esc(a.chapter)}</div>`:''}
        </div>`).join('');
    }
    box.classList.add('open');
  }catch(e){
    box.innerHTML = `<div class="art"><div class="art-c">載入失敗：${esc(e.message)}</div></div>`;
    box.classList.add('open');
  }
}

let timer;
$('q').addEventListener('input', ()=>{ clearTimeout(timer); timer=setTimeout(render,200); });
init();
</script>
</body>
</html>
