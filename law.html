<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1012">
<title>ATLAS 法規條文庫 v2.2.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');
:root{
  --bg:#0e1012;--sb:#141618;--panel:#1a1d21;--card:#1f2328;--border:#2a2f36;--border2:#353b44;
  --gold:#d4a843;--gold2:#f0cc7a;--teal:#3aaa8c;--teal2:#4dc9a8;--red:#e06c6c;--indigo:#7b8cff;
  --text:#dde2ee;--sub:#8a94a6;--muted:#4a5566;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
/* 大螢幕自動放大（外接螢幕）：1600px 以上 110%、2200px 以上 125% */
@media (min-width:1600px){html{zoom:1.1}}
@media (min-width:2200px){html{zoom:1.25}}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;overflow-x:hidden}
.mono{font-family:'Space Mono',monospace}
button,input,textarea,select{font-family:inherit;font-size:inherit}
a{color:var(--teal2)}

/* ── 登入 ── */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 26px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.brand .mark{font-family:'Space Mono',monospace;letter-spacing:.3em;color:var(--gold);font-size:12px}
.brand h1{font-size:20px;font-weight:700}
.login-box p{color:var(--sub);font-size:12.5px;margin-bottom:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;letter-spacing:.06em}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;border:1px solid var(--border2);background:var(--card);color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:700}
.btn.pri:hover{background:var(--gold2)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:6px}
.btn.w{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:18px}

/* ── 主畫面 ── */
#app{display:none;height:100%;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sb);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.topbar .brand{margin:0}
.topbar .brand h1{font-size:15px}
.spacer{flex:1}
.stat{font-size:11.5px;color:var(--sub);white-space:nowrap}
.topbar{min-width:0}
.stat b{color:var(--gold2);font-family:'Space Mono',monospace}

.toolbar{display:flex;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;align-items:center}
.toolbar>*{min-width:0}
.toolbar .row2{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 11px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none}
.toolbar input{flex:1;min-width:180px}
.toolbar input:focus{border-color:var(--gold)}
.chips{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--sub);cursor:pointer}
.chip:hover{border-color:var(--gold);color:var(--gold2)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:600}
.chip.tg.on{background:var(--teal);border-color:var(--teal);color:#06211a}

.main{flex:1;display:flex;min-height:0}
.list{width:clamp(300px, 26vw, 460px);flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;background:var(--sb)}

/* 樹 */
.dom{border-bottom:1px solid var(--border)}
.dom-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none;font-size:11.5px;letter-spacing:.14em;color:var(--gold);font-weight:700;background:var(--sb);position:sticky;top:0;z-index:2}
.dom-head:hover{background:var(--panel)}
.dom-head .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:0}
.dom>.body{display:none}.dom.open>.body{display:block}
.asp-head{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 20px;cursor:pointer;user-select:none;font-size:12px;color:var(--indigo);font-weight:500}
.asp-head:hover{background:var(--panel)}
.asp-head .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-family:'Space Mono',monospace}
.asp>.body{display:none}.asp.open>.body{display:block}
.scp-head{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 32px;cursor:pointer;user-select:none;font-size:11px;color:var(--teal2);letter-spacing:.08em}
.scp-head:hover{background:var(--panel)}
.scp-head .cnt{margin-left:auto;font-size:10.5px;color:var(--muted);font-family:'Space Mono',monospace}
.scp>.body{display:none}.scp.open>.body{display:block}
.scp.open>.scp-head>.arrow{transform:rotate(90deg)}
.scp .law-head{padding-left:52px}.scp .art-row{padding-left:70px}
.dom>.body>.scp .scp-head{padding-left:20px}.dom>.body>.scp .law-head{padding-left:40px}.dom>.body>.scp .art-row{padding-left:58px}
.arrow{color:var(--muted);font-size:10px;transition:transform .15s;width:10px;flex-shrink:0}
.open>.dom-head>.arrow,.open>.asp-head>.arrow,.law.open>.law-head>.arrow{transform:rotate(90deg)}
.law-head{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 30px;cursor:pointer;user-select:none;font-size:12.5px;font-weight:500}
.asp .law-head{padding-left:42px}
.law-head:hover{background:var(--panel)}
.law-head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.law-head .cnt{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace}
.law-head .bd{font-size:10px;border-radius:4px;padding:0 5px;text-decoration:none;white-space:nowrap;flex-shrink:0}
.bd.pdf{color:var(--gold2);border:1px solid var(--gold2)}
.bd.pdf:hover{background:var(--gold2);color:#111}
.bd.dl{color:var(--muted);border:1px dashed var(--muted)}
.bd.dl:hover{color:var(--text);border-style:solid}
.bd.ab{color:var(--red);border:1px solid var(--red)}
.bd.sc{color:var(--teal2);border:1px solid var(--teal)}
.bd.ed{color:var(--muted);border:1px solid transparent;cursor:pointer}
.bd.ed:hover{color:var(--gold2);border-color:var(--gold2)}
.law>.body{display:none}.law.open>.body{display:block}
.law.pdfonly .arrow{visibility:hidden}
.law.pdfonly .law-head::before{content:'·';color:var(--muted);margin-left:-14px;width:8px}
.bd.ver{color:var(--gold2);border:1px solid var(--border2)}
.bd.ver.cur{border-color:var(--gold2);font-weight:700}
.bd.ver:hover{background:var(--gold2);color:#111}
.bd.sh{color:var(--teal2);border:1px solid var(--teal)}
.bd.sh:hover{background:var(--teal);color:#06211a}
.d-meta .sh{color:var(--teal2);cursor:pointer}
.art-row{display:flex;gap:8px;align-items:baseline;padding:6px 12px 6px 48px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent}
.asp .art-row{padding-left:60px}
.art-row:hover{background:var(--panel)}
.art-row.active{background:var(--card);border-left-color:var(--gold)}
.art-row .no{font-family:'Space Mono',monospace;color:var(--gold2);min-width:46px;font-size:11.5px}
.art-row .pv{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.art-row .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;opacity:0}
.art-row.noted .dot{opacity:1}

.detail{flex:1;overflow-y:auto;padding:22px 26px}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px}
.d-law{font-size:12px;color:var(--sub);letter-spacing:.06em}
.d-law b{color:var(--gold2);font-weight:500}
.d-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.d-title h2{font-size:22px;font-weight:700}
.d-title h2 .mono{color:var(--gold2)}
.pill{font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid var(--border2);color:var(--sub)}
.pill.ok{border-color:var(--teal);color:var(--teal2)}
.pill.ab{border-color:var(--red);color:var(--red)}
.pill.asp{border-color:var(--indigo);color:var(--indigo)}
.d-meta{font-size:11.5px;color:var(--muted);margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap}
.d-meta .pdf{color:var(--gold2)}
.d-content{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px;white-space:pre-wrap;line-height:1.95;font-size:14.5px;margin-bottom:20px}
.note-box{border:1px solid var(--gold);border-radius:10px;background:rgba(212,168,67,.05)}
.note-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(212,168,67,.3);font-size:12.5px;font-weight:500;color:var(--gold2)}
.note-head .hint{color:var(--sub);font-weight:400;font-size:11.5px}
.note-box textarea{width:100%;min-height:140px;padding:14px;background:transparent;border:0;color:var(--text);resize:vertical;outline:none;line-height:1.8}
.note-foot{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid rgba(212,168,67,.3)}
.note-foot .st{font-size:11.5px;color:var(--sub);flex:1}
.note-foot .st.ok{color:var(--teal2)}
.note-foot .st.err{color:var(--red)}

/* 法規屬性面板 */
.lp{max-width:640px}
.lp h2{font-size:18px;margin:4px 0 2px}
.lp .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:16px 0}
.lp .grid .full{grid-column:1/-1}
.lp .noted-list{margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
.lp .noted-list h3{font-size:12px;color:var(--sub);letter-spacing:.1em;margin-bottom:8px}
.lp .noted-list .it{padding:6px 0;border-bottom:1px dashed var(--border);cursor:pointer;font-size:12.5px}
.lp .noted-list .it:hover{color:var(--gold2)}
.lp .noted-list .it .no{font-family:'Space Mono',monospace;color:var(--gold2);margin-right:8px}
.lp .noted-list .it .pv{color:var(--sub)}

@media (max-width:700px){
  .main{flex-direction:column}
  .list{width:100%;max-height:44vh;border-right:0;border-bottom:1px solid var(--border)}
  .detail{padding:16px}
  .d-title h2{font-size:18px}
  .stat{display:none}
  .lp .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ═══ 登入 ═══ -->
<div id="login">
  <div class="login-box">
    <div class="brand"><span class="mark">▲ ATLAS</span><h1>法規條文庫</h1></div>
    <p>帷幄 · 僅限本人登入</p>
    <form id="loginForm">
      <div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>PASSWORD</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn pri w" id="loginBtn" type="submit">登入</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- ═══ 主畫面 ═══ -->
<div id="app">
  <div class="topbar">
    <a class="brand" href="index.html" title="回帷幄首頁" style="text-decoration:none;color:inherit"><span class="mark">▲ ATLAS</span><h1>法規條文庫</h1></a>
    <a class="btn sm" href="index.html" title="回帷幄首頁" style="text-decoration:none">⌂ 首頁</a>
    <span class="stat">共 <b id="stTotal">0</b> 條 · <b id="stLaws">0</b> 部 · 已註記 <b id="stNoted">0</b></span>
    <span class="spacer"></span>
    <button class="btn sm" id="logoutBtn">登出</button>
  </div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="搜尋：領域、面向（如 權變估價）、法規名、條號（27-1）、條文、註記…">
    <select id="fDomain"><option value="">全部領域</option></select>
    <button class="chip" id="btnNew" title="新增純 PDF 法規（CNS、地方法規…）">＋ 新增法規</button>
    <div class="row2">
      <div class="chips" id="aspChips"></div>
      <span style="width:1px;height:16px;background:var(--border2);margin:0 4px"></span>
      <button class="chip tg" id="tgCore" title="只看核心法規">核心</button>
      <button class="chip tg" id="tgNoted" title="只看已註記的條文">已註記</button>
    </div>
  </div>
  <div class="main">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"><div class="empty">左側選一條條文，或點法規旁的 ✎ 編輯分類</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.min.js"></script>
<script>
// ═══════════════════════════════════════════════
// 設定：Publishable key 可公開；寫入權限由 Supabase RLS 控制
// ═══════════════════════════════════════════════
const SB_URL = 'https://riiflvhbxrnmzriwngjs.supabase.co';
const SB_KEY = 'sb_publishable_R69Hj9hcR5G4dp3Uz1J0PQ_1BabpwsN';
const sb = supabase.createClient(SB_URL, SB_KEY);
const ASPECTS = ['A可行性','B容積獎勵','C權變估價','D稅務','E產權土地','F程序組織','G建築執行'];
const ASP_SORT = Object.fromEntries(ASPECTS.map((a,i)=>[a,i]));

const $ = s => document.querySelector(s);
let ROWS = [], LAWS = new Map(), DOMAINS = [], CUR = null, PDFS = new Map(); // PDFS: code → [{ver,file}]
const SCOPE_ORDER = { '中央': 0, '臺北市': 1, '新北市': 2, '其他縣市': 3 };
let fAspect = '', tgCore = false, tgNoted = false;
// 展開狀態：本機記憶（每台裝置各自）
let OPEN = new Set(JSON.parse(localStorage.getItem('atlas-law-open') || '["d:都市更新"]'));
function saveOpen(){ try{ localStorage.setItem('atlas-law-open', JSON.stringify([...OPEN])); }catch{} }

// ── 登入 ──
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginBtn').disabled = true; $('#loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
  $('#loginBtn').disabled = false;
  if (error) { $('#loginErr').textContent = '登入失敗：' + (error.message.includes('Invalid') ? '帳號或密碼錯誤' : error.message); return; }
  boot();
});
$('#logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

// ── 啟動 ──
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#login').style.display = 'flex'; $('#app').style.display = 'none'; return; }
  $('#login').style.display = 'none'; $('#app').style.display = 'flex';
  await load();
}
async function load() {
  $('#list').innerHTML = '<div class="empty">載入中…</div>';
  const [a, l, d] = await Promise.all([
    sb.from('law_articles').select('article_id,law_name,law_code,article_no,article_sort,content,chapter,aspect,law_level,modified_date,source_url,status,my_note').order('law_code').order('article_sort').range(0, 4999),
    sb.from('laws').select('*').order('sort').order('law_code'),
    sb.from('law_domains').select('name,sort').order('sort'),
  ]);
  const err = a.error || l.error || d.error;
  if (err) { $('#list').innerHTML = `<div class="empty" style="color:var(--red)">讀取失敗：${err.message}<br><br>若是 laws / law_domains 不存在，請先執行 supabase_06_laws.sql</div>`; return; }
  ROWS = a.data; LAWS = new Map(l.data.map(x => [x.law_code, x])); DOMAINS = d.data.map(x => x.name);
  // 條文表有、主檔沒有的法規 → 臨時補一筆（下次同步腳本會寫進 laws）
  for (const r of ROWS) if (!LAWS.has(r.law_code)) LAWS.set(r.law_code, { law_code: r.law_code, law_name: r.law_name, domain: '都市更新', aspect: r.aspect, tags: [], scope: '中央', law_level: r.law_level, tier: '核心', sort: 100, status: r.status, _tmp: true });
  for (const x of LAWS.values()) if (!DOMAINS.includes(x.domain)) DOMAINS.push(x.domain);
  $('#fDomain').innerHTML = '<option value="">全部領域</option>' + DOMAINS.map(n => `<option>${esc(n)}</option>`).join('');
  render();
  loadPdfList();
}

// ── PDF 原檔（Supabase Storage / law-pdf，私有，登入者可讀）──
async function loadPdfList() {
  try {
    const { data, error } = await sb.storage.from('law-pdf').list('', { limit: 500 });
    if (error) throw error;
    PDFS = new Map();
    for (const f of (data || [])) {
      const m = /^(.+?)(?:_([^_]+))?\.pdf$/i.exec(f.name); if (!m) continue;
      const code = m[1], ver = m[2] || '';
      if (!PDFS.has(code)) PDFS.set(code, []);
      PDFS.get(code).push({ ver, file: f.name });
    }
    for (const v of PDFS.values()) v.sort((a, b) => (a.ver === '' ? -1 : b.ver === '' ? 1 : b.ver.localeCompare(a.ver))); // 現行版在前，再依年份新→舊
    if (PDFS.size) render();
  } catch (e) { console.warn('PDF 清單讀取失敗：', e.message); }
}
async function openPdf(file) {
  if (!/\.pdf$/i.test(file)) file += '.pdf';
  const { data, error } = await sb.storage.from('law-pdf').createSignedUrl(file, 3600);
  if (error) { alert('開啟失敗：' + error.message); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}
// 分享 PDF 檔本身（手機原生分享面板）；不支援的裝置退回下載
async function sharePdf(file, title) {
  try {
    const { data, error } = await sb.storage.from('law-pdf').download(file);
    if (error) throw error;
    const f = new File([data], file, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: title || file }); return; }
    const u = URL.createObjectURL(f); const a = document.createElement('a'); a.href = u; a.download = file; a.click(); setTimeout(() => URL.revokeObjectURL(u), 5000);
  } catch (e) { if (e.name !== 'AbortError') alert('分享失敗：' + e.message); }
}
function pdfBadges(l) {
  const vs = PDFS.get(l.law_code) || [];
  return vs.map((v, i) => `<a class="bd ver${i === 0 ? ' cur' : ''}" data-pdf="${v.file}" title="開啟 ${v.file}">📄${v.ver ? ' ' + esc(v.ver) : ''}</a>`).join('');
}
function dlUrl(law) {
  if (/^[A-Z]\d{7}$/.test(law.law_code)) return `https://law.moj.gov.tw/LawClass/FilesType.aspx?DataId=${law.law_code}&md=m`;
  return law.source_url || '';
}

// ── 篩選 ──
function lawText(l) { return [l.domain, l.aspect, l.law_name, l.law_code, ...(l.tags||[]), l.my_note||''].join(' ').toLowerCase(); }
// 回傳 Map(code → arts[])；純 PDF 法規 arts 為 []
function filtered() {
  const q = $('#q').value.trim().toLowerCase(), dom = $('#fDomain').value;
  const byCode = new Map(); for (const r of ROWS) { if (!byCode.has(r.law_code)) byCode.set(r.law_code, []); byCode.get(r.law_code).push(r); }
  const out = new Map();
  for (const l of LAWS.values()) {
    if (dom && l.domain !== dom) continue;
    if (fAspect && (l.aspect || '') !== fAspect) continue;
    if (tgCore && l.tier !== '核心') continue;
    const arts = byCode.get(l.law_code) || [];
    const lawHit = q ? lawText(l).includes(q) : true;
    let keep = arts.filter(r => {
      if (tgNoted && !(r.my_note && r.my_note.trim())) return false;
      if (!q || lawHit) return true;
      return (r.article_no + ' ' + (r.content||'') + ' ' + (r.my_note||'')).toLowerCase().includes(q);
    });
    if (arts.length === 0) { if (tgNoted || !lawHit) continue; }          // 純 PDF：只看法規本身是否命中
    else if (keep.length === 0) continue;
    out.set(l.law_code, keep);
  }
  return out;
}

// ── 樹渲染：領域 → 面向 → 法規 → 條文 ──
function render() {
  const byLaw = filtered();
  $('#stTotal').textContent = ROWS.length;
  $('#stLaws').textContent = LAWS.size;
  $('#stNoted').textContent = ROWS.filter(r => r.my_note && r.my_note.trim()).length;
  // 面向快速鍵：依目前領域列出該領域實際用到的第二層（都市更新固定 A–G 順序）
  const dom0 = $('#fDomain').value;
  const aspSet = new Set(); for (const l of LAWS.values()) if ((!dom0 || l.domain === dom0) && l.aspect) aspSet.add(l.aspect);
  const aspList = [...aspSet].sort((a, b) => (ASP_SORT[a] ?? 50) - (ASP_SORT[b] ?? 50) || a.localeCompare(b));
  if (fAspect && !aspSet.has(fAspect)) fAspect = '';
  $('#aspChips').innerHTML = aspList.map(a => `<button class="chip${a === fAspect ? ' on' : ''}" data-asp="${esc(a)}">${esc(a)}</button>`).join('');
  $('#tgCore').classList.toggle('on', tgCore); $('#tgNoted').classList.toggle('on', tgNoted);

  const searching = !!($('#q').value.trim() || tgNoted || fAspect || dom0);
  // 分組
  const tree = new Map(); // domain → Map(aspect → Map(code → arts))
  for (const [code, arts] of byLaw) {
    const l = LAWS.get(code), asp = l.aspect || '';
    if (!tree.has(l.domain)) tree.set(l.domain, new Map());
    const A = tree.get(l.domain); if (!A.has(asp)) A.set(asp, new Map());
    A.get(asp).set(code, arts);
  }
  const domOrder = [...tree.keys()].sort((a, b) => (DOMAINS.indexOf(a) + 1 || 99) - (DOMAINS.indexOf(b) + 1 || 99));
  let h = '';
  for (const dom of domOrder) {
    const A = tree.get(dom);
    const dCnt = [...A.values()].reduce((n, L) => n + L.size, 0);
    const dOpen = searching || OPEN.has('d:' + dom);
    h += `<div class="dom${dOpen ? ' open' : ''}" data-k="d:${esc(dom)}"><div class="dom-head"><span class="arrow">▶</span><span>${esc(dom)}</span><span class="cnt">${dCnt} 部</span></div><div class="body">`;
    const aspOrder = [...A.keys()].sort((a, b) => (a === '' ? 99 : ASP_SORT[a] ?? 50) - (b === '' ? 99 : ASP_SORT[b] ?? 50));
    for (const asp of aspOrder) {
      const L = A.get(asp);
      const laws = [...L.entries()].sort((a, b) => { const x = LAWS.get(a[0]), y = LAWS.get(b[0]);
        return ((SCOPE_ORDER[x.scope] ?? 9) - (SCOPE_ORDER[y.scope] ?? 9)) || (x.sort - y.sort) || a[0].localeCompare(b[0]); });
      const lawsHtml = renderScopes(laws, dom + '/' + asp, searching);
      if (asp === '') { h += lawsHtml; continue; }
      const aOpen = searching || !OPEN.has('ac:' + dom + '/' + asp);
      h += `<div class="asp${aOpen ? ' open' : ''}" data-k="a:${esc(dom)}/${esc(asp)}"><div class="asp-head"><span class="arrow">▶</span><span>${esc(asp)}</span><span class="cnt">${L.size}</span></div><div class="body">${lawsHtml}</div></div>`;
    }
    h += `</div></div>`;
  }
  $('#list').innerHTML = h || '<div class="empty">沒有符合的條文</div>';
}
// 第四層：適用範圍（中央 → 臺北市 → 新北市）。預設中央展開、地方收合；只有一種範圍時不加這層
function renderScopes(laws, path, searching) {
  const groups = new Map();
  for (const [code, arts] of laws) { const sc = LAWS.get(code).scope || '中央'; if (!groups.has(sc)) groups.set(sc, []); groups.get(sc).push([code, arts]); }
  const lawsHtml = g => g.map(([code, arts]) => renderLaw(LAWS.get(code), arts, searching)).join('');
  if (groups.size <= 1) return lawsHtml(laws);
  return [...groups.entries()].sort((a, b) => (SCOPE_ORDER[a[0]] ?? 9) - (SCOPE_ORDER[b[0]] ?? 9)).map(([sc, g]) => {
    const k = 's:' + path + '/' + sc;
    const open = searching || (OPEN.has(k + ':open') ? true : OPEN.has(k + ':closed') ? false : sc === '中央');
    return `<div class="scp${open ? ' open' : ''}" data-k="${esc(k)}"><div class="scp-head"><span class="arrow">▶</span><span>${esc(sc)}${sc === '中央' ? '法規' : ''}</span><span class="cnt">${g.length}</span></div><div class="body">${lawsHtml(g)}</div></div>`;
  }).join('');
}
function renderLaw(l, arts, searching) {
  const q = $('#q').value.trim().toLowerCase();
  // 搜尋時：命中法規名/分類但沒命中條文 → 不自動展開條文（只露出法規），避免一次攤開幾百條
  const open = (searching && (tgNoted || (q && !lawText(l).includes(q)))) || OPEN.has('l:' + l.law_code);
  const pdfOnly = !ROWS.some(r => r.law_code === l.law_code);
  const vs = PDFS.get(l.law_code) || [], dl = dlUrl(l);
  const badges =
    (l.scope && l.scope !== '中央' ? `<span class="bd sc">${esc(l.scope)}</span>` : '') +
    (l.status === '已廢止' ? '<span class="bd ab">廢止</span>' : '') +
    (vs.length ? pdfBadges(l)
               : dl ? `<a class="bd dl" href="${dl}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="下載官方 PDF，存成 ${l.law_code}.pdf 後拖進 Supabase Storage / law-pdf">⬇</a>` : '') +
    `<span class="bd ed" data-edit="${l.law_code}" title="編輯分類／註記">✎</span>`;
  return `<div class="law${open ? ' open' : ''}${pdfOnly ? ' pdfonly' : ''}" data-k="l:${l.law_code}" data-code="${l.law_code}">
    <div class="law-head"><span class="arrow">▶</span><span class="nm" title="${esc(l.law_name)}">${esc(l.law_name)}</span>${badges}${pdfOnly ? '' : `<span class="cnt">${arts.length}</span>`}</div>
    <div class="body">${arts.map(r => `
      <div class="art-row${r.my_note && r.my_note.trim() ? ' noted' : ''}${CUR && CUR.article_id === r.article_id ? ' active' : ''}" data-id="${r.article_id}">
        <span class="no">§${r.article_no}</span><span class="pv">${esc((r.content||'').slice(0, 40))}</span><span class="dot"></span>
      </div>`).join('')}</div></div>`;
}

$('#list').addEventListener('click', e => {
  const pdf = e.target.closest('[data-pdf]');
  if (pdf) { e.stopPropagation(); openPdf(pdf.dataset.pdf); return; }
  const ed = e.target.closest('[data-edit]');
  if (ed) { e.stopPropagation(); showLaw(ed.dataset.edit); return; }
  const sh = e.target.closest('.scp-head');
  if (sh) { const g = sh.parentElement, k = g.dataset.k; g.classList.toggle('open'); const o = g.classList.contains('open'); OPEN.delete(k + (o ? ':closed' : ':open')); OPEN.add(k + (o ? ':open' : ':closed')); saveOpen(); return; }
  const head = e.target.closest('.dom-head,.asp-head,.law-head');
  if (head && head.parentElement.classList.contains('pdfonly')) {
    const code = head.parentElement.dataset.code, vs = PDFS.get(code) || [];
    vs.length ? openPdf(vs[0].file) : showLaw(code); return;
  }
  if (head) {
    const g = head.parentElement, k = g.dataset.k;
    g.classList.toggle('open');
    const isOpen = g.classList.contains('open');
    if (k.startsWith('a:')) { const ck = 'ac:' + k.slice(2); isOpen ? OPEN.delete(ck) : OPEN.add(ck); }   // 面向：預設展開，記錄收起
    else { isOpen ? OPEN.add(k) : OPEN.delete(k); }
    saveOpen(); return;
  }
  const row = e.target.closest('.art-row');
  if (row) show(ROWS.find(r => r.article_id === row.dataset.id));
});
$('#q').addEventListener('input', render);
$('#fDomain').addEventListener('change', render);
$('#aspChips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; fAspect = fAspect === c.dataset.asp ? '' : c.dataset.asp; render(); });
$('#tgCore').addEventListener('click', () => { tgCore = !tgCore; render(); });
$('#tgNoted').addEventListener('click', () => { tgNoted = !tgNoted; render(); });
$('#btnNew').addEventListener('click', () => showLaw(null));

// ── 條文詳情 + 註記 ──
function show(r) {
  CUR = r; const l = LAWS.get(r.law_code);
  OPEN.add('l:' + r.law_code); OPEN.add('d:' + l.domain); if (l.aspect) OPEN.delete('ac:' + l.domain + '/' + l.aspect); { const k = 's:' + l.domain + '/' + (l.aspect || '') + '/' + (l.scope || '中央'); OPEN.delete(k + ':closed'); OPEN.add(k + ':open'); } saveOpen();
  document.querySelectorAll('.art-row.active').forEach(x => x.classList.remove('active'));
  document.querySelector(`.art-row[data-id="${r.article_id}"]`)?.classList.add('active');
  const st = r.status === '已廢止' ? '<span class="pill ab">已廢止</span>' : r.status === '已修正待覆核' ? '<span class="pill">已修正待覆核</span>' : '<span class="pill ok">現行</span>';
  $('#detail').innerHTML = `
    <div class="d-law">${esc(l.domain)} › ${esc(l.aspect || '—')} › <b>${esc(r.law_name)}</b> · ${r.law_code} · ${r.law_level || ''}</div>
    <div class="d-title"><h2>第 <span class="mono">${r.article_no}</span> 條</h2>${st}${l.scope !== '中央' ? `<span class="pill">${esc(l.scope)}</span>` : ''}</div>
    <div class="d-meta"><span>${esc(r.chapter || '')}</span><span>修正 ${r.modified_date || '—'}</span><a href="${r.source_url}" target="_blank" rel="noopener">法規來源 ↗</a>${(PDFS.get(r.law_code) || []).map(v => `<a class="pdf" href="#" onclick="openPdf('${v.file}');return false">📄 PDF${v.ver ? ' ' + esc(v.ver) : ''}</a>`).join('')}${PDFS.has(r.law_code) ? `<a class="sh" onclick="sharePdf('${PDFS.get(r.law_code)[0].file}','${esc(r.law_name)}')">⇪ 分享 PDF</a>` : ''}</div>
    <div class="d-content">${esc(r.content || '')}</div>
    <div class="note-box">
      <div class="note-head">★ 我的註記 <span class="hint">實務經驗、審議慣例、談判眉角 — 只有你看得到，同步永不覆蓋</span></div>
      <textarea id="note" placeholder="例：新北實務上這條會要求先……">${esc(r.my_note || '')}</textarea>
      <div class="note-foot"><span class="st" id="noteSt">${r.my_note ? '已儲存' : '尚無註記'}</span><button class="btn sm pri" id="saveNote">儲存註記</button></div>
    </div>`;
  $('#saveNote').addEventListener('click', saveNote);
  $('#note').addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') saveNote(); });
  if (window.innerWidth <= 700) $('#detail').scrollIntoView({ behavior: 'smooth' });
}
async function saveNote() {
  const st = $('#noteSt'), val = $('#note').value;
  st.className = 'st'; st.textContent = '儲存中…'; $('#saveNote').disabled = true;
  const { error } = await sb.from('law_articles').update({ my_note: val || null }).eq('article_id', CUR.article_id);
  $('#saveNote').disabled = false;
  if (error) { st.className = 'st err'; st.textContent = '儲存失敗：' + error.message; return; }
  CUR.my_note = val; st.className = 'st ok'; st.textContent = '✓ 已儲存 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  render();
}

// ── 法規屬性面板（分類／標籤／法規註記）──
function showLaw(code) {
  const isNew = !code;
  const l = isNew ? { law_code: '', law_name: '', domain: $('#fDomain').value || '都市更新', aspect: fAspect || null, tags: [], scope: '中央', law_level: null, tier: '核心', sort: 100, _new: true } : LAWS.get(code);
  CUR = null;
  const noted = ROWS.filter(r => r.law_code === code && r.my_note && r.my_note.trim());
  const nArts = ROWS.filter(r => r.law_code === code).length;
  const vs = PDFS.get(code) || [];
  const opt = (list, v) => list.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('');
  const aspAll = [...new Set([...ASPECTS, ...[...LAWS.values()].map(x => x.aspect).filter(Boolean)])];
  $('#detail').innerHTML = `<div class="lp">
    <div class="d-law">${isNew ? '新增法規（純 PDF 型：CNS、地方法規、手冊…）' : '法規屬性 · ' + code}${l._tmp ? ' · <span style="color:var(--red)">主檔尚無此筆，儲存後建立</span>' : ''}</div>
    ${isNew ? '' : `<h2>${esc(l.law_name)}</h2>`}
    <div class="d-meta">${isNew ? '' : `<span>${l.law_level || ''}</span><span>修正 ${l.modified_date || '—'}</span><span>${nArts ? nArts + ' 條' : '純 PDF'}</span>`}${l.source_url ? `<a href="${l.source_url}" target="_blank" rel="noopener">法規來源 ↗</a>` : ''}
      ${vs.map(v => `<a class="pdf" href="#" onclick="openPdf('${v.file}');return false">📄 ${v.ver ? esc(v.ver) : '現行'}</a>`).join('')}${vs.length ? `<a class="sh" onclick="sharePdf('${vs[0].file}','${esc(l.law_name)}')">⇪ 分享</a>` : ''}
    </div>
    <div class="grid">
      ${isNew ? `<div class="field"><label>代碼（＝PDF 檔名主體，例：CNS3299、TPE-01、NTPC-01）</label><input id="lpCode" placeholder="CNS3299"></div>
      <div class="field"><label>名稱</label><input id="lpName" placeholder="陶瓷面磚"></div>
      <div class="field full"><label>來源網址（選填）</label><input id="lpUrl" placeholder="https://…"></div>` : `<div class="field full"><label>名稱（樹上顯示）</label><input id="lpName" value="${esc(l.law_name)}"></div>`}
      <div class="field"><label>領域</label><input id="lpDomain" list="domList" value="${esc(l.domain)}"><datalist id="domList">${DOMAINS.map(d => `<option value="${esc(d)}">`).join('')}</datalist></div>
      <div class="field"><label>面向／第二層（可空，可自訂）</label><input id="lpAspect" list="aspList" value="${esc(l.aspect || '')}" placeholder="都市更新用 A–G；建材可用 磁磚、石材…"><datalist id="aspList">${aspAll.map(a => `<option value="${esc(a)}">`).join('')}</datalist></div>
      <div class="field"><label>適用範圍</label><select id="lpScope">${opt(['中央','臺北市','新北市','其他縣市'], l.scope)}</select></div>
      <div class="field"><label>分級</label><select id="lpTier">${opt(['核心','外圍'], l.tier)}</select></div>
      <div class="field"><label>同層排序（小的在前）</label><input id="lpSort" type="number" value="${l.sort ?? 100}"></div>
      <div class="field"><label>標籤（逗號分隔，搜尋用）</label><input id="lpTags" value="${esc((l.tags||[]).join(', '))}" placeholder="例：可行性, 危老"></div>
      <div class="field full"><label>法規註記（例：主要看第 3、6、8 條）</label><textarea id="lpNote" rows="3">${esc(l.my_note || '')}</textarea></div>
    </div>
    <div class="note-foot" style="border:0;padding:0"><span class="st" id="lpSt"></span>${isNew ? '' : `<button class="btn sm" id="lpDel" style="color:var(--red);border-color:var(--red)">刪除此法規</button>`}<button class="btn sm pri" id="lpSave">儲存</button></div>
    ${vs.length ? '' : `<p style="font-size:11.5px;color:var(--muted);margin-top:14px">PDF 檔名規則：<span class="mono">${esc(isNew ? '代碼' : code)}.pdf</span>＝現行版；<span class="mono">${esc(isNew ? '代碼' : code)}_2015.pdf</span>＝舊版。拖進 Supabase Storage / law-pdf 後重新整理。</p>`}
    ${noted.length ? `<div class="noted-list"><h3>已註記條文 · ${noted.length}</h3>${noted.map(r => `<div class="it" data-go="${r.article_id}"><span class="no">§${r.article_no}</span><span class="pv">${esc(r.my_note.slice(0, 60))}</span></div>`).join('')}</div>` : ''}
  </div>`;
  $('#lpSave').addEventListener('click', () => saveLaw(isNew ? null : code));
  $('#lpDel')?.addEventListener('click', () => deleteLaw(code));
  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => show(ROWS.find(r => r.article_id === el.dataset.go))));
  if (window.innerWidth <= 700) $('#detail').scrollIntoView({ behavior: 'smooth' });
}
async function saveLaw(code) {
  const st = $('#lpSt');
  if (!code) {
    code = $('#lpCode').value.trim().replace(/\s+/g, '');
    const name = $('#lpName').value.trim();
    if (!code || !name) { st.className = 'st err'; st.textContent = '代碼與名稱必填'; return; }
    if (LAWS.has(code)) { st.className = 'st err'; st.textContent = '代碼已存在：' + LAWS.get(code).law_name; return; }
    LAWS.set(code, { law_code: code, law_name: name, source_url: $('#lpUrl').value.trim() || null, law_level: null, modified_date: null, status: '現行', _tmp: true });
  }
  const l = LAWS.get(code);
  const newName = $('#lpName') ? $('#lpName').value.trim() : '';
  if (newName) l.law_name = newName;
  const upd = {
    law_code: code, law_name: l.law_name,
    domain: $('#lpDomain').value.trim() || '都市更新',
    aspect: $('#lpAspect').value.trim() || null,
    scope: $('#lpScope').value, tier: $('#lpTier').value,
    sort: parseInt($('#lpSort').value) || 100,
    tags: $('#lpTags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
    my_note: $('#lpNote').value.trim() || null,
  };
  if (l._tmp) Object.assign(upd, { law_level: l.law_level, source_url: l.source_url, modified_date: l.modified_date, status: l.status });
  st.className = 'st'; st.textContent = '儲存中…'; $('#lpSave').disabled = true;
  const { error } = await sb.from('laws').upsert(upd, { onConflict: 'law_code' });
  $('#lpSave').disabled = false;
  if (error) { st.className = 'st err'; st.textContent = '儲存失敗：' + error.message; return; }
  if (!DOMAINS.includes(upd.domain)) { DOMAINS.push(upd.domain); await sb.from('law_domains').upsert({ name: upd.domain, sort: 100 }, { onConflict: 'name' }); $('#fDomain').innerHTML = '<option value="">全部領域</option>' + DOMAINS.map(n => `<option>${esc(n)}</option>`).join(''); }
  Object.assign(l, upd); delete l._tmp;
  OPEN.add('d:' + upd.domain); if (upd.aspect) OPEN.delete('ac:' + upd.domain + '/' + upd.aspect); saveOpen();
  st.className = 'st ok'; st.textContent = '✓ 已儲存';
  render(); showLaw(code);
}
async function deleteLaw(code) {
  const l = LAWS.get(code), n = ROWS.filter(r => r.law_code === code).length, vs = PDFS.get(code) || [];
  if (!confirm(`確定刪除「${l.law_name}」？\n會一併刪除：${n} 條條文（含你的註記）、${vs.length} 份 PDF。\n此動作無法復原。`)) return;
  const st = $('#lpSt'); st.className = 'st'; st.textContent = '刪除中…';
  try {
    if (n) { const { error } = await sb.from('law_articles').delete().eq('law_code', code); if (error) throw error; }
    if (vs.length) { const { error } = await sb.storage.from('law-pdf').remove(vs.map(v => v.file)); if (error) throw error; }
    const { error } = await sb.from('laws').delete().eq('law_code', code); if (error) throw error;
    ROWS = ROWS.filter(r => r.law_code !== code); LAWS.delete(code); PDFS.delete(code); CUR = null;
    $('#detail').innerHTML = '<div class="empty">已刪除</div>'; render();
  } catch (e) { st.className = 'st err'; st.textContent = '刪除失敗：' + e.message; }
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

boot();
</script>
