<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS 容積獎勵 v1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1012;--sb:#141618;--panel:#1a1d21;--card:#1f2328;--border:#2a2f36;--border2:#353b44;--gold:#d4a843;--gold2:#f0cc7a;--teal:#3aaa8c;--teal2:#4dc9a8;--red:#e06c6c;--indigo:#7b8cff;--amber:#e8b04a;--text:#dde2ee;--sub:#8a94a6;--muted:#4a5566}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
.mono{font-family:'Space Mono',monospace}
button,input,select{font-family:inherit;font-size:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--sb);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .brand{font-weight:700;letter-spacing:.18em;font-size:12px;color:var(--gold)}
.top .brand small{color:var(--sub);letter-spacing:.04em;font-weight:400;margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.seg button{padding:6px 14px;background:transparent;border:0;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1200;font-weight:700}
.top .case{margin-left:auto;font-size:12px;color:var(--sub)}
.top .case b{color:var(--text);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--border2);background:var(--card);color:var(--text);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:700}

/* 進度列（固定在頂欄下） */
.gauge{position:sticky;top:53px;z-index:19;background:var(--sb);border-bottom:1px solid var(--border);padding:10px 16px 12px}
.gauge .row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.gauge .big{font-size:28px;font-weight:700;color:var(--gold2)}
.gauge .big small{font-size:12px;color:var(--sub);font-weight:400;margin-left:4px}
.gauge .cap{font-size:12px;color:var(--sub)}
.gauge .cap b{color:var(--text);font-weight:500}
.gauge .warn{color:var(--red);font-size:12px}
.bar{position:relative;height:10px;border-radius:5px;background:var(--border);max-width:1100px;margin:8px auto 0;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal),var(--teal2));transition:width .25s}
.bar .fill.over{background:linear-gradient(90deg,var(--amber),var(--red))}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold2)}
.bar .tick::after{content:attr(data-l);position:absolute;top:12px;left:-16px;font-size:10px;color:var(--gold2);font-family:'Space Mono',monospace;white-space:nowrap}
.gauge .legend{display:flex;gap:16px;max-width:1100px;margin:16px auto 0;font-size:11px;color:var(--sub);flex-wrap:wrap}
.gauge .legend span b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 80px;display:grid;grid-template-columns:1fr 320px;gap:20px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{order:-1}}

/* 區段標題：第一層金、第二層青綠 */
h2.g1{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:600;margin:14px 0 8px;display:flex;align-items:center;gap:10px}
h2.g1 .c{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);margin-left:auto}
h2.g1 .sum{font-family:'Space Mono',monospace;font-size:12px;color:var(--teal2)}
.hint{font-size:12px;color:var(--sub);margin-bottom:10px}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;border-left:3px solid var(--border2)}
.card.on{border-left-color:var(--teal)}
.card.block{opacity:.55}
.card .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .art{font-family:'Space Mono',monospace;font-size:11px;color:var(--indigo);border:1px solid var(--indigo);border-radius:5px;padding:0 6px;cursor:pointer;white-space:nowrap}
.card .art:hover{background:var(--indigo);color:#fff}
.card .nm{font-weight:500;font-size:14px}
.card .plain{font-size:12px;color:var(--sub);grid-column:1}
.card .ctl{grid-column:1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.card select,.card input{padding:6px 9px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none;min-width:0}
.card select:focus,.card input:focus{border-color:var(--gold)}
.card input.n{width:110px;font-family:'Space Mono',monospace}
.card .unit{font-size:12px;color:var(--sub)}
.card .pct{grid-column:2;grid-row:1/4;align-self:center;text-align:right;font-family:'Space Mono',monospace;font-size:22px;color:var(--muted);min-width:70px}
.card.on .pct{color:var(--teal2)}
.card .pct small{display:block;font-size:10px;color:var(--sub);font-family:'Noto Sans TC',sans-serif}
.card .note{grid-column:1/-1;font-size:11px;color:var(--amber)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.chk i{width:16px;height:16px;border:1px solid var(--amber);border-radius:4px;display:inline-block;position:relative;flex-shrink:0}
.chk.on i{background:var(--teal);border-color:var(--teal)}
.chk.on i::after{content:'✓';position:absolute;left:2px;top:-4px;color:#fff;font-size:11px}

/* 右欄：上限計算（吃案件地號） */
.side{position:sticky;top:150px;align-self:start}@media (max-width:900px){.side{position:static}}
.side .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.side h3{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.side h3 .c{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)}
.zone{border-left:2px solid var(--teal);padding:4px 0 4px 10px;margin:6px 0}
.zone .z{color:var(--teal2);font-weight:500;font-size:13px}
.zone .z small{color:var(--sub);font-weight:400;margin-left:6px}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:1px 0}
.kv b{font-family:'Space Mono',monospace;font-weight:400;color:var(--text)}
.kv.hl b{color:var(--gold2)}
.kv.tot{border-top:1px dashed var(--border2);margin-top:4px;padding-top:4px}
.side label{font-size:11px;color:var(--teal2);display:block;margin:6px 0 2px}
.side input,.side select{width:100%;padding:6px 9px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);outline:none}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pick .o{border:1px solid var(--border2);border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;color:var(--sub)}
.pick .o b{display:block;font-family:'Space Mono',monospace;color:var(--text);font-weight:400}
.pick .o.on{border-color:var(--gold);background:rgba(212,168,67,.1);color:var(--gold2)}
.pick .o.on b{color:var(--gold2)}

/* 法條側欄 */
.drawer{position:fixed;top:0;right:-440px;width:420px;max-width:100vw;height:100vh;background:var(--panel);border-left:1px solid var(--border);z-index:50;transition:right .22s;display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer .dh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:10px}
.drawer .dh .art{font-family:'Space Mono',monospace;color:var(--indigo)}
.drawer .dh .x{margin-left:auto;cursor:pointer;color:var(--sub)}
.drawer .body{padding:14px 16px;overflow:auto;font-size:13px;line-height:1.9;color:var(--text)}
.drawer .law{font-size:11px;color:var(--sub);margin-bottom:8px}
.drawer .mine{margin-top:16px;border-top:1px dashed var(--border2);padding-top:10px}
.drawer .mine h4{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:600;margin-bottom:6px}
.drawer .mine p{color:var(--amber);font-size:12.5px}
.drawer .go{display:inline-block;margin-top:10px;font-size:12px;color:var(--teal2)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49;display:none}
.scrim.on{display:block}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--sb);border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:20}
.foot .s{font-size:12px;color:var(--sub);margin-right:auto}
.tag{font-size:10.5px;padding:1px 7px;border-radius:5px;border:1px solid var(--border2);color:var(--sub)}
.tag.src{color:var(--teal2);border-color:var(--teal)}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 26px}
.login-box h1{font-size:18px;margin-bottom:4px}.login-box p{color:var(--sub);font-size:12.5px;margin-bottom:20px}
.login-box .field{margin-bottom:12px}.login-box label{display:block;font-size:11px;color:var(--teal2);letter-spacing:.1em;margin-bottom:4px}.login-box input{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text)}
.login-box .err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}.btn.w{width:100%;justify-content:center;margin-top:6px}
#app{display:none}
.top select{padding:6px 9px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);max-width:260px}
.top .case a{color:var(--teal2);text-decoration:none}
.st{font-size:12px;color:var(--sub)}.st.err{color:var(--red)}.st.ok{color:var(--teal2)}
.planbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.planbar input{padding:6px 9px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);width:140px}
.zone .ov{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--sub);margin-top:3px}.zone .ov input{width:90px;padding:3px 6px;font-size:12px;font-family:'Space Mono',monospace}
.empty{padding:40px;text-align:center;color:var(--sub)}
.card input.n.wide{width:150px}
</style>
</head>
<body>
<div id="login">
  <div class="login-box">
    <div class="brand"><span class="mark" style="color:var(--gold);font-weight:700;letter-spacing:.18em">▲ ATLAS</span><h1>容積獎勵</h1></div>
    <p>帷幄 · 僅限本人登入</p>
    <form id="loginForm">
      <div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>PASSWORD</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn pri w" id="loginBtn" type="submit">登入</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</div>
<div id="app">
<div class="top">
  <a href="index.html" class="brand" style="text-decoration:none">ATLAS · 容積獎勵<small id="verLine">v1.0</small></a>
  <div class="seg" id="regime"><button data-r="ur" class="on">都市更新</button><button data-r="dw">危老重建</button></div>
  <div class="planbar"><select id="planSel"></select><input id="planName" placeholder="方案名稱"><button class="btn" id="planNew">＋ 新方案</button><button class="btn pri" id="planSave">存雲端</button><button class="btn" id="planDel" title="刪除方案">🗑</button><span class="st" id="planSt"></span></div>
  <span class="case" id="caseLine"></span>
  <button class="btn" id="logoutBtn" style="margin-left:6px">登出</button>
</div>

<div class="gauge">
  <div class="row">
    <span class="big" id="gTot">0%<small>基準容積</small></span>
    <span class="cap" id="gCap"></span>
    <span class="warn" id="gWarn"></span>
  </div>
  <div class="bar"><div class="fill" id="gFill" style="width:0"></div><div class="tick" id="gTick" data-l="上限"></div></div>
  <div class="legend"><span><b style="background:var(--teal)"></b>已選獎勵</span><span><b style="background:var(--gold2)"></b>上限線</span><span><b style="background:var(--red)"></b>超過上限會被砍到上限，多選無效</span><span id="itemsSrc" style="margin-left:auto"></span></div>
</div>

<div class="wrap">
  <div class="main" id="main"></div>
  <div class="side" id="side"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><span class="art" id="dArt"></span><span id="dTitle"></span><span class="x" id="dX">✕</span></div>
  <div class="body"><div class="law" id="dLaw"></div><div id="dText"></div>
    <div class="mine"><h4>我的註記（法規庫同一筆）</h4><p id="dMine"></p><a class="go" href="#" id="dGo" target="_blank">在法規庫開啟這條 →</a></div></div>
</div>

<div class="foot"><span class="s" id="fS"></span><a class="btn" id="backCase" href="cases.html">← 回案件</a><button class="btn pri" id="toCost" disabled title="成本分析模組做好後開放">帶入成本分析 →</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://riiflvhbxrnmzriwngjs.supabase.co', SB_KEY='sb_publishable_R69Hj9hcR5G4dp3Uz1J0PQ_1BabpwsN';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>(Math.round(v*1000)/10).toLocaleString()+'%'; const fmt=v=>Math.round(v||0).toLocaleString();
const CAPS={ur:{central:.50,local:.20},dw:{ab:.30,time:.10}};

// ── 狀態 ──
let ITEMS=[], CASE=null, PCL=[], ZR=[], PLANS=[], PLAN=null, R='ur', CITY='新北市', UID=null, DIRTY=false, AUTOS=null;
const urId=+new URLSearchParams(location.search).get('ur')||null;

// ── 登入 ──
$('#loginForm').addEventListener('submit',async e=>{ e.preventDefault(); $('#loginBtn').disabled=true; $('#loginErr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pw').value}); $('#loginBtn').disabled=false;
  if(error){ $('#loginErr').textContent='登入失敗：'+(error.message.includes('Invalid')?'帳號或密碼錯誤':error.message); return; } boot(); });
$('#logoutBtn').addEventListener('click',async()=>{ await sb.auth.signOut(); location.reload(); });
sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT') location.reload(); });

async function boot(){ const {data:{session}}=await sb.auth.getSession(); if(!session){ $('#login').style.display='flex'; $('#app').style.display='none'; return; }
  UID=session.user.id; $('#login').style.display='none'; $('#app').style.display='block'; await loadAll(); }

async function loadAll(){
  const [it,zr]=await Promise.all([ sb.from('far_bonus_items').select('*').is('effective_to',null).order('sort'), sb.from('zoning_rules').select('*').is('effective_to',null) ]);
  if(it.error){ $('#main').innerHTML=`<div class="empty">讀取獎勵表失敗：${esc(it.error.message)}（請先跑 supabase_40_far.sql）</div>`; return; }
  ITEMS=it.data; ZR=zr.data||[];
  $('#itemsSrc').textContent=`獎勵項目 ${ITEMS.length} 筆（Supabase far_bonus_items，現行版）`;
  if(urId){ const [u,p,pl]=await Promise.all([ sb.from('ur_projects').select('*').eq('id',urId).single(), sb.from('parcels').select('*').eq('ur_project_id',urId).order('sort_order'), sb.from('far_plans').select('*').eq('ur_project_id',urId).order('updated_at',{ascending:false}) ]);
    if(u.error){ $('#caseLine').innerHTML='<span style="color:var(--red)">找不到案件 #'+urId+'</span>'; } else { CASE=u.data; PCL=p.data||[]; PLANS=pl.data||[]; CITY=caseCity(); if(CASE.kind==='危老重建') R='dw'; }
    $('#backCase').href=`cases.html?t=ur&id=${urId}`; }
  if(!CASE){ $('#caseLine').innerHTML='未指定案件 — 快速試算（不存檔）。從案件中心的「容積獎勵 →」進來才會帶入地號並可存方案。'; }
  else $('#caseLine').innerHTML=`案件：<b>${esc(CASE.name)}</b> · ${esc(CITY)} · ${PCL.length} 筆地號 <span class="tag src">案件中心帶入</span>`;
  [...$('#regime').children].forEach(b=>b.classList.toggle('on',b.dataset.r===R));
  if(PLANS.length) PLAN=PLANS[0]; else PLAN=newPlan('方案一'); renderPlanSel(); render(); }
function caseCity(){ const t=(CASE?.address||'')+(PCL[0]?.section||''); return /臺北市|台北市/.test(t)?'臺北市':'新北市'; }
function newPlan(name){ return {id:null,ur_project_id:urId,name,regime:R,city:CITY,picks:{},overrides:{},cap_rule:'auto'}; }

// ── 基地：地號依分區分組（＝Excel 的 @.基地資料 一欄一區） ──
function zones(){
  if(!CASE) return [{z:'（示意）住宅區',far:200,bcr:50,area:1000,orig:0,parcels:0,pub:0,av:0}];
  const by={}; for(const p of PCL){ if(p.in_site===false) continue; const z=p.zoning||'未填分區'; const r=ZR.find(r=>r.city===CITY&&r.zone===z&&!r.condition&&(!p.far_pct||r.far_pct===p.far_pct))||ZR.find(r=>r.city===CITY&&r.zone===z);
    const o=(by[z]??={z,far:p.far_pct||r?.far_pct||0,bcr:r?.bcr_pct||0,area:0,orig:0,parcels:0,pub:0,av:0}); o.area+=+p.area_m2||0; o.parcels++; if(p.is_public) o.pub+=+p.area_m2||0; o.orig+=+p.bldg_floor_m2||0; o.av+=(+p.announced_value||0)*(+p.area_m2||0); }
  return Object.values(by).map(o=>{ const ov=PLAN?.overrides?.[o.z]||{}; return {...o,far:ov.far??o.far,orig:ov.orig??o.orig,excludePub:!!ov.excludePub}; }); }
const baseFA=()=>zones().reduce((a,z)=>a+(z.area-(z.excludePub?z.pub:0))*z.far/100,0);
const origFA=()=>zones().reduce((a,z)=>a+z.orig,0);
const siteArea=()=>zones().reduce((a,z)=>a+z.area,0);
const avTotal=()=>zones().reduce((a,z)=>a+z.av,0);

// ── 項目與計算 ──
function liveItems(){ return ITEMS.filter(i=>i.regime===R&&(i.level!=='local'||i.city===CITY)); }
function groupsOf(){ const g={}; for(const i of liveItems()) (g[i.grp]??={label:i.grp,level:i.level,sub:i.sub,items:[]}).items.push(i); return Object.values(g); }
function itemVal(it){ const v=PLAN.picks[it.code]; const b=baseFA()||1;
  if(it.kind==='pick'){ const i=+v||0; let r=+(it.opts?.[i]?.[1]||0); if(r===-1){ const a=siteArea(); r=a>=3000?.05+Math.floor((a-3000)/100)*.003:0; } return r; }
  if(it.kind==='num'){ return (+v||0)*(+it.rate||1)/b; }
  if(it.kind==='count'){ const n=+v||0; if(it.per) return n*+it.per; let r=0; for(const [k,p] of (it.ladder||[])) if(n>=k) r=+p; return r; }
  if(it.kind==='cash'){ const amt=(+v||0)*1e4; const av=avTotal(); if(!amt||!av) return 0; return (amt/(av/b*1.4))/b; }
  if(it.kind==='pct'){ return (+v||0)/100; }
  return 0; }
function calc(){
  const gs=groupsOf(); const out={groups:{}}; let central=0,local=0,ab=0,time=0;
  for(const g of gs){ const s=g.items.reduce((a,it)=>a+itemVal(it),0); out.groups[g.label]=s; if(R==='ur'){ if(g.level==='central') central+=s; else local+=s; } else { if(g.level==='time') time+=s; else ab+=s; } }
  if(R==='ur'){ out.central=Math.min(central,CAPS.ur.central); out.local=Math.min(local,CAPS.ur.local); out.raw=central+local; out.capped=out.central+out.local; out.cap=CAPS.ur.central+CAPS.ur.local; }
  else { out.ab=Math.min(ab,CAPS.dw.ab); out.time=Math.min(time,CAPS.dw.time); out.raw=ab+time; out.capped=out.ab+out.time; out.cap=CAPS.dw.ab+CAPS.dw.time; }
  const b=baseFA(), o=origFA();
  out.rules=R==='ur'?[['基準×1.5',b*1.5],['原容＋法容30%',o+b*.3],['原容×1.2',o*1.2],['原容×1.3',o*1.3]]:[['基準×1.3',b*1.3],['原容×1.15',o*1.15]];
  out.ruleIdx=PLAN.cap_rule==='auto'?out.rules.reduce((m,r,i,a)=>r[1]>a[m][1]?i:m,0):+PLAN.cap_rule;
  out.allow=out.rules[out.ruleIdx][1]+(R==='dw'?b*out.time:0);
  out.base=b; out.orig=o; out.bonusFA=b*out.capped; out.totalFA=Math.min(b+out.bonusFA,out.allow); out.cut=b+out.bonusFA>out.allow; return out; }

// ── 畫面 ──
function render(){
  const c=calc(); const gs=groupsOf();
  $('#main').innerHTML=gs.length?gs.map(g=>{ const s=c.groups[g.label]; const cap=R==='ur'?(g.level==='central'?CAPS.ur.central:CAPS.ur.local):(g.level==='time'?CAPS.dw.time:null);
    return `<h2 class="g1">${esc(g.label)}<span class="sum">${pct(s)}${cap?' / 上限 '+pct(cap):''}</span><span class="c">${g.items.length} 項</span></h2>`+g.items.map(card).join(''); }).join(''):`<div class="empty">沒有 ${R==='ur'?'都更':'危老'} 的獎勵項目（${esc(CITY)}）</div>`;
  $('#gTot').innerHTML=`${pct(c.capped)}<small>基準容積 · ${fmt(c.bonusFA)} ㎡ ≈ ${fmt(c.bonusFA*.3025)} 坪</small>`;
  $('#gCap').innerHTML=R==='ur'?`中央 <b>${pct(c.central)}</b>／50% · 地方 <b>${pct(c.local)}</b>／20% · 允建上限 <b>${fmt(c.allow)} ㎡</b>（${c.rules[c.ruleIdx][0]}）`:`A＋B <b>${pct(c.ab)}</b>／30% · 時程規模 <b>${pct(c.time)}</b>／10% · 允建上限 <b>${fmt(c.allow)} ㎡</b>`;
  $('#gWarn').textContent=c.raw>c.capped+1e-9?`已選 ${pct(c.raw)}，超過上限 ${pct(c.raw-c.capped)} 無效`:c.cut?`獎勵後總容積超過允建上限，會被砍到 ${fmt(c.allow)} ㎡`:'';
  $('#gFill').style.width=(Math.min(c.raw/(c.cap*1.25),1)*100)+'%'; $('#gFill').className='fill'+(c.raw>c.cap+1e-9?' over':''); $('#gTick').style.left=(c.cap/(c.cap*1.25)*100)+'%'; $('#gTick').dataset.l='上限 '+pct(c.cap);
  renderSide(c); $('#fS').textContent=CASE?(PLAN.id?`方案「${PLAN.name}」· 改動後 3 秒自動存雲端`:'新方案尚未存雲端'):'快速試算不存檔'; }
function card(it){ const v=PLAN.picks[it.code]; const val=itemVal(it); const on=val>0; let ctl='';
  if(it.kind==='pick') ctl=`<select data-it="${it.code}">${(it.opts||[]).map((o,i)=>`<option value="${i}"${(+v||0)===i?' selected':''}>${esc(o[0])}</option>`).join('')}</select>`;
  else if(it.kind==='num') ctl=`<input class="n" data-it="${it.code}" inputmode="decimal" value="${esc(v||'')}" placeholder="0"><span class="unit">${esc(it.unit||'㎡')} × ${it.rate}</span>`;
  else if(it.kind==='count') ctl=`<input class="n" data-it="${it.code}" inputmode="numeric" value="${esc(v||'')}" placeholder="0"><span class="unit">項／棟（最多 ${it.max_n}）</span>`;
  else if(it.kind==='cash') ctl=`<input class="n wide" data-it="${it.code}" inputmode="decimal" value="${esc(v||'')}" placeholder="0"><span class="unit">${esc(it.unit)}（公告現值總額 ${fmt(avTotal())} 元）</span>`;
  else if(it.kind==='pct') ctl=`<input class="n" data-it="${it.code}" inputmode="decimal" value="${esc(v||'')}" placeholder="0"><span class="unit">% 基準容積（預估）</span>`;
  return `<div class="card${on?' on':''}"><div class="hd"><span class="art" data-art="${it.code}" title="看法條">${esc(it.article||'')}</span><span class="nm">${esc(it.name)}</span>${it.excl?'<span class="tag">同條不得累計</span>':''}</div>
    <div class="plain">${esc(it.plain||'')}</div><div class="ctl">${ctl}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:''}
    <div class="pct">${on?pct(val):'—'}<small>${on?fmt(val*baseFA())+' ㎡':'未選'}</small></div></div>`; }
function renderSide(c){ const zs=zones();
  $('#side').innerHTML=`<div class="box"><h3>基地（案件中心帶入）<span class="c">${zs.reduce((a,z)=>a+z.parcels,0)} 筆地號</span></h3>
    ${zs.map(z=>`<div class="zone"><div class="z">${esc(z.z)}<small>容積 ${z.far}% · 建蔽 ${z.bcr||'?'}%</small></div>
      <div class="kv"><span>基地面積${z.pub?`（含公有 ${fmt(z.pub)}）`:''}</span><b>${fmt(z.area)} ㎡</b></div>
      ${z.pub?`<div class="ov"><label class="chk${z.excludePub?' on':''}" data-ov="excludePub" data-z="${esc(z.z)}"><i></i>基準容積不含公有地</label></div>`:''}
      <div class="kv"><span>基準容積</span><b>${fmt((z.area-(z.excludePub?z.pub:0))*z.far/100)} ㎡</b></div>
      <div class="kv"><span>原建築容積 <span class="tag">合法建物樓地板</span></span><b>${fmt(z.orig)} ㎡</b></div>
      <div class="ov">覆寫：容積率 <input data-ov="far" data-z="${esc(z.z)}" value="${PLAN.overrides?.[z.z]?.far??''}" placeholder="${z.far}"> 原容積 <input data-ov="orig" data-z="${esc(z.z)}" value="${PLAN.overrides?.[z.z]?.orig??''}" placeholder="${fmt(z.orig)}"></div></div>`).join('')}
    <div class="kv tot"><span>基準容積合計</span><b>${fmt(c.base)} ㎡</b></div><div class="kv"><span>原容積合計</span><b>${fmt(c.orig)} ㎡</b></div></div>
  <div class="box"><h3>允建總容積上限<span class="c">${R==='ur'?'都更 4 取法':'危老 2 取法'}</span></h3>
    <div class="hint">預設取最有利的一種，也可以手動指定。</div>
    <div class="pick"><div class="o${PLAN.cap_rule==='auto'?' on':''}" data-rule="auto">自動取最大<b>${c.rules[c.ruleIdx][0]}</b></div>${c.rules.map((r,i)=>`<div class="o${PLAN.cap_rule==String(i)?' on':''}" data-rule="${i}">${esc(r[0])}<b>${fmt(r[1])} ㎡</b></div>`).join('')}</div></div>
  <div class="box"><h3>結果</h3>
    <div class="kv"><span>基準容積</span><b>${fmt(c.base)} ㎡</b></div>
    <div class="kv"><span>＋ 獎勵容積（${pct(c.capped)}）</span><b>${fmt(c.bonusFA)} ㎡</b></div>
    <div class="kv"><span>允建上限</span><b>${fmt(c.allow)} ㎡</b></div>
    <div class="kv tot hl"><span>允建總容積</span><b>${fmt(c.totalFA)} ㎡</b></div>
    <div class="kv hl"><span>換算</span><b>${fmt(c.totalFA*.3025)} 坪 · ${c.base?(c.totalFA/c.base).toFixed(2):'—'} 倍基準</b></div></div>`;
  document.querySelectorAll('[data-rule]').forEach(el=>el.addEventListener('click',()=>{ PLAN.cap_rule=el.dataset.rule; touch(); }));
  document.querySelectorAll('input[data-ov]').forEach(el=>el.addEventListener('change',()=>{ const o=(PLAN.overrides[el.dataset.z]??={}); const v=el.value.trim(); if(v==='') delete o[el.dataset.ov]; else o[el.dataset.ov]=+v; touch(); }));
  document.querySelectorAll('label[data-ov]').forEach(el=>el.addEventListener('click',()=>{ const o=(PLAN.overrides[el.dataset.z]??={}); o.excludePub=!o.excludePub; touch(); })); }
function touch(){ DIRTY=true; render(); if(CASE){ clearTimeout(AUTOS); AUTOS=setTimeout(()=>savePlan(true),3000); } }

document.addEventListener('change',e=>{ const id=e.target.dataset.it; if(!id) return; PLAN.picks[id]=e.target.value; touch(); });
let INP=null; document.addEventListener('input',e=>{ const id=e.target.dataset.it; if(!id||e.target.tagName!=='INPUT') return; PLAN.picks[id]=e.target.value; DIRTY=true; const c=calc(); $('#gTot').innerHTML=`${pct(c.capped)}<small>基準容積 · ${fmt(c.bonusFA)} ㎡ ≈ ${fmt(c.bonusFA*.3025)} 坪</small>`; clearTimeout(INP); INP=setTimeout(()=>{ const a=document.activeElement; const sel=a?.dataset?.it; touch(); if(sel){ const el=document.querySelector(`[data-it="${sel}"]`); el?.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(_){} } },700); });
$('#regime').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; R=b.dataset.r; PLAN.regime=R; [...$('#regime').children].forEach(x=>x.classList.toggle('on',x===b)); touch(); });

// ── 方案 ──
function renderPlanSel(){ const sel=$('#planSel'); sel.innerHTML=PLANS.map(p=>`<option value="${p.id}"${PLAN?.id===p.id?' selected':''}>${esc(p.name)}（${p.regime==='dw'?'危老':'都更'}）</option>`).join('')+(PLAN&&!PLAN.id?`<option value="new" selected>${esc(PLAN.name)}（未存）</option>`:''); $('#planName').value=PLAN?.name||''; sel.style.display=CASE?'':'none'; $('#planNew').style.display=$('#planSave').style.display=$('#planDel').style.display=CASE?'':'none'; }
$('#planSel').addEventListener('change',e=>{ const p=PLANS.find(x=>String(x.id)===e.target.value); if(p){ PLAN=p; R=p.regime; [...$('#regime').children].forEach(x=>x.classList.toggle('on',x.dataset.r===R)); renderPlanSel(); render(); } });
$('#planNew').addEventListener('click',()=>{ PLAN=newPlan(`方案${['一','二','三','四','五','六'][PLANS.length]||PLANS.length+1}`); renderPlanSel(); render(); });
$('#planName').addEventListener('change',e=>{ PLAN.name=e.target.value.trim()||PLAN.name; touch(); });
$('#planSave').addEventListener('click',()=>savePlan(false));
async function savePlan(quiet){ if(!CASE) return; const st=$('#planSt'); st.className='st'; st.textContent='存雲端…'; const c=calc();
  const row={ur_project_id:urId,name:PLAN.name,regime:R,city:CITY,picks:PLAN.picks,overrides:PLAN.overrides,cap_rule:PLAN.cap_rule,result:{pct:c.capped,base:c.base,bonus:c.bonusFA,allow:c.allow,total:c.totalFA,rule:c.rules[c.ruleIdx][0]},items_snapshot:liveItems().map(i=>({code:i.code,name:i.name,opts:i.opts,rate:i.rate,ladder:i.ladder,per:i.per,article:i.article}))};
  const q=PLAN.id?sb.from('far_plans').update(row).eq('id',PLAN.id).select().single():sb.from('far_plans').insert(row).select().single(); const {data,error}=await q;
  if(error){ st.className='st err'; st.textContent='存檔失敗：'+error.message; return; }
  const i=PLANS.findIndex(p=>p.id===data.id); if(i>=0) PLANS[i]=data; else PLANS.unshift(data); PLAN=data; DIRTY=false; renderPlanSel(); st.className='st ok'; st.textContent=(quiet?'已自動存 ':'已存 ')+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}); render(); }
$('#planDel').addEventListener('click',async()=>{ if(!PLAN.id){ return; } if(!confirm(`刪除方案「${PLAN.name}」？`)) return; const {error}=await sb.from('far_plans').update({deleted_at:new Date().toISOString()}).eq('id',PLAN.id); if(error){ alert(error.message); return; } PLANS=PLANS.filter(p=>p.id!==PLAN.id); PLAN=PLANS[0]||newPlan('方案一'); renderPlanSel(); render(); });
window.addEventListener('beforeunload',()=>{ if(AUTOS){ clearTimeout(AUTOS); try{ savePlan(true); }catch(e){} } });

// ── 法條側欄：從法規庫抓條文＋我的註記 ──
document.addEventListener('click',async e=>{ const a=e.target.closest('[data-art]'); if(!a) return; const it=ITEMS.find(x=>x.code===a.dataset.art); if(!it) return;
  $('#dArt').textContent=it.article||''; $('#dTitle').textContent=it.name; $('#dLaw').textContent=it.law_name||''; $('#dText').innerHTML=esc(it.law_text||'（無摘錄）').replace(/\n/g,'<br>'); $('#dMine').textContent='…'; $('#dGo').href='law.html?q='+encodeURIComponent(it.law_name||'');
  $('#drawer').classList.add('open'); $('#scrim').classList.add('on');
  const no=(it.article||'').match(/§\s*(\d+)/)?.[1]; if(!no||!it.law_name){ $('#dMine').textContent='（這條沒有對到法規庫條號）'; return; }
  const {data}=await sb.from('law_articles').select('article_id,content,my_note,law_name').ilike('law_name','%'+it.law_name.replace(/^臺北市|^新北市/,'')+'%').eq('article_no',+no).limit(3);
  const row=(data||[]).find(r=>r.law_name===it.law_name)||(data||[])[0];
  if(row){ $('#dText').innerHTML=esc(row.content).replace(/\n/g,'<br>'); $('#dLaw').textContent=row.law_name+' · 法規庫現行條文'; $('#dMine').textContent=row.my_note||'（還沒寫註記；到法規庫這條寫，兩邊同步）'; $('#dGo').href='law.html?a='+encodeURIComponent(row.article_id); }
  else $('#dMine').textContent='（法規庫沒有這部法規，先用試算表摘錄）'; });
const closeD=()=>{ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('on'); }; $('#dX').addEventListener('click',closeD); $('#scrim').addEventListener('click',closeD);
boot();
</script>
